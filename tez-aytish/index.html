<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#ffffff">
<title>Tez aytish — trenajyor</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#fff;--surface:#f5f5f7;--ink:#1d1d1f;--sub:#6e6e73;--faint:#b0b0b6;--line:#e5e5ea;--accent:#ff5a3c;--accent-press:#e8492c;--accent-tint:#ffebe6;--ok:#1e8e3e;--warn:#8a5a00;--warn-tint:#fff1cc;--warn-line:#f0b429;--star:#f5a623;--ease:cubic-bezier(.2,.8,.2,1);--tabs-h:62px}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);overscroll-behavior:none}
body{color:var(--ink);font-family:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.4;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;border:0;background:none;padding:0}
button:focus-visible{outline:3px solid #0a84ff;outline-offset:3px}
button:disabled{opacity:.45;cursor:default}
h1,h2,p,ul{margin:0}
.hide{display:none!important}
.i{display:block;width:22px;height:22px}

/* The feed: one full-screen card per tongue twister, swiped vertically like Reels. */
.feed{position:fixed;top:0;right:0;bottom:0;left:0;overflow-y:auto;overflow-x:hidden;scroll-snap-type:y mandatory;overscroll-behavior:none;scrollbar-width:none}
.feed::-webkit-scrollbar{display:none}
.feed.lock{overflow:hidden}
.feed.away{visibility:hidden}
body.tabs-on .feed{top:calc(var(--tabs-h) + env(safe-area-inset-top))}
body.tabs-on .card{padding-top:8px}
.card{position:relative;height:100%;width:min(100%,480px);margin:0 auto;scroll-snap-align:start;scroll-snap-stop:always;display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top)) 20px calc(12px + env(safe-area-inset-bottom))}

/* Stage segments on top, like Stories. */
.segs{display:flex;gap:5px}
.seg{flex:1;height:22px;display:flex;align-items:center}
.seg i{display:block;width:100%;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.seg b{display:block;height:100%;width:0;border-radius:2px;background:var(--accent)}
.seg.on i{background:var(--accent-tint)}
.seg.done b{width:100%}
.seglab{display:flex;gap:5px;margin-top:-3px}
.seglab span{flex:1;font-size:12px;font-weight:700;color:var(--faint)}
.seglab span.on{color:var(--accent)}
.seglab span.done{color:var(--sub)}
.meta{display:flex;align-items:center;gap:4px;margin-top:6px;min-height:40px;font-size:14px;font-weight:700;color:var(--sub);font-variant-numeric:tabular-nums}
.meta .sp{flex:1}
.brand{font-size:16px;font-weight:800;color:var(--ink)}
.total{display:inline-flex;align-items:center;gap:4px;color:var(--ink);margin-right:4px}
.total .i{width:17px;height:17px}
.star path{fill:var(--star);stroke:var(--star);stroke-width:1.6;stroke-linejoin:round}
.ico{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink)}
.ico:active{background:var(--surface)}
.admin-only{display:none}
.is-admin .admin-only{display:grid}

/* Text and the side rail. */
.box{flex:1;min-height:0;display:flex;align-items:center;gap:12px}
.body{flex:1;min-width:0}
.cap{margin-bottom:10px;font-size:14px;font-weight:600;color:var(--sub)}
.cap b{color:var(--accent);font-weight:800}
.tw{font-weight:800;letter-spacing:-.02em;line-height:1.3;font-size:34px}
.tw.s1{font-size:42px}.tw.s2{font-size:34px}.tw.s3{font-size:29px}.tw.s4{font-size:25px}
.w{display:inline-block;max-width:100%;overflow-wrap:anywhere;vertical-align:top;border-bottom:3px solid transparent;border-radius:8px;transition:background-color .15s,box-shadow .15s,color .2s}
.w u{text-decoration:none}
.hs{font-weight:inherit;color:var(--accent)}
.sy{font-style:normal;font-weight:500;color:var(--faint);margin:0 .03em}
.w.on{background:var(--accent-tint);box-shadow:0 0 0 4px var(--accent-tint)}
.tw.res .hs{color:inherit}
.w.ok,.w.near{color:var(--ok)}
.w.near{border-bottom:3px dotted var(--warn-line);border-radius:0}
.w.wrong{color:var(--warn);background:var(--warn-tint);box-shadow:0 0 0 4px var(--warn-tint)}
.w.missing{color:var(--faint);border-bottom:3px dashed var(--faint);border-radius:0}
.w small{display:block;margin-top:1px;font-size:13px;line-height:1.2;font-weight:700;letter-spacing:0}
.rail{flex:none;display:flex;flex-direction:column;align-items:center;gap:12px}
.rb{width:46px;height:46px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:21px;line-height:1;transition:transform .15s var(--ease),background-color .15s,color .15s}
.rb:active{transform:scale(.93)}
.rb.on{background:var(--accent-tint);color:var(--accent)}
.rb.ask{animation:ask 1.1s var(--ease) 3}

/* The snow leopard. */
.bars svg{display:block;width:100%;height:100%}
.bars.sm{width:50px;height:50px;border-radius:50%;background:var(--accent-tint);padding:3px}
.bars.lg{width:92px;height:92px;flex:none}
.bars.xl{width:164px;height:164px;flex:none}
.bars .e-happy,.bars .e-wink,.bars .m-open{display:none}
.bars .e-open{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
.bars[data-mood=happy] .e-open,.bars[data-mood=happy] .m-smile{display:none}
.bars[data-mood=happy] .e-happy,.bars[data-mood=happy] .m-open{display:inline}
.bars[data-mood=happy]{animation:hop .5s var(--ease) 2}
.bars[data-mood=wink] .e-open.r{display:none}
.bars[data-mood=wink] .e-wink{display:inline}
.bars[data-mood=listen] .e-open{animation:none;transform:scale(1.18)}

/* Status line, action zone, foot. */
.status{min-height:62px;margin-top:8px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;text-align:center}
.stars{display:flex;gap:6px}
.stars svg{width:30px;height:30px}
.stars path,.st path{fill:var(--line);stroke:var(--line);stroke-width:1.6;stroke-linejoin:round}
.stars .f path,.st .f path{fill:var(--star);stroke:var(--star)}
.stars .a{animation:pop .4s var(--ease) both}
.msg{font-size:15px;line-height:1.35;font-weight:700;color:var(--sub);max-width:310px}
.msg.ok{color:var(--ok)}
.msg.warn{color:var(--warn)}
.act{min-height:134px;margin-top:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.pill{width:min(100%,300px);min-height:56px;padding:0 26px;border-radius:28px;background:var(--surface);color:var(--ink);font-size:17px;font-weight:800;transition:transform .15s var(--ease),background-color .15s}
.pill:active{transform:scale(.97)}
.pill.primary{background:var(--accent);color:#fff}
.pill.primary:active{background:var(--accent-press)}
.pill.small{width:auto;min-height:44px;font-size:15px}
.micbox{position:relative;width:128px;height:128px;display:grid;place-items:center}
.ring{position:absolute;top:0;left:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:7}
.ring .trk{stroke:var(--accent-tint)}
.ring .prg{stroke:var(--accent);stroke-linecap:round;stroke-dasharray:377;stroke-dashoffset:377;transition:stroke .2s}
.micbox.over .prg{stroke:var(--warn-line)}
.halo{position:absolute;width:92px;height:92px;border-radius:50%;background:var(--accent-tint);transition:transform .09s linear}
.mic{position:relative;width:92px;height:92px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;transition:transform .15s var(--ease),background-color .15s}
.mic:active{transform:scale(.96);background:var(--accent-press)}
.mic .i{width:36px;height:36px;grid-area:1/1}
.mic .i-stop,.mic .i-dots{display:none}
.micbox.rec .i-mic{display:none}
.micbox.rec .i-stop{display:block}
.micbox.busy .i-mic,.micbox.busy .i-stop{display:none}
.micbox.busy .i-dots{display:block}
.i-dots circle{animation:dots 1.1s infinite}
.i-dots circle:nth-child(2){animation-delay:.15s}
.i-dots circle:nth-child(3){animation-delay:.3s}
.foot{margin-top:6px;min-height:24px;display:flex;align-items:center;justify-content:center;gap:5px;font-size:13px;font-weight:600;color:var(--sub);text-align:center}
.foot .i{width:16px;height:16px}
.foot.up{color:var(--ink)}
.foot.up .i{animation:nudge 1.4s var(--ease) infinite}
.foot.shake{animation:shake .4s}
.link{font-size:13px;font-weight:600;color:var(--sub);text-decoration:underline;text-underline-offset:3px;padding:6px 8px}

/* Welcome and summary cards. */
.hero{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.hero h1{margin-top:8px;font-size:34px;line-height:1.15;font-weight:800;letter-spacing:-.02em}
.lead{font-size:17px;line-height:1.45;font-weight:500;color:var(--sub);max-width:310px}
.consent .lead{font-size:15px}
.summary .hero{justify-content:flex-start;gap:6px;overflow-y:auto;overscroll-behavior:contain;padding-top:4px}
.summary .hero h1{font-size:28px;margin-top:2px}
.summary .lead{font-size:15px}
.sum{list-style:none;padding:0;width:100%;margin-top:6px}
.sum li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px;font-weight:600}
.sum li>span:first-child{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.st{display:flex;gap:2px;flex:none}
.st svg{width:17px;height:17px}
.hard{width:100%;margin-top:10px;text-align:left}
.hard p{margin-bottom:7px;font-size:13px;font-weight:700;color:var(--sub)}
.chip{display:inline-block;margin:0 6px 6px 0;padding:5px 10px;border-radius:10px;background:var(--warn-tint);color:var(--warn);font-size:14px;font-weight:700}

/* Tabs on top (Reels | Modullar) and the modules screen. */
.tabs{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;justify-content:center;padding:calc(8px + env(safe-area-inset-top)) 16px 6px;background:var(--bg)}
.tabs-in{display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--surface)}
.tab{min-width:112px;min-height:40px;padding:0 18px;border-radius:999px;font-size:15px;font-weight:800;color:var(--sub);transition:background-color .15s,color .15s}
.tab.on{background:var(--bg);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.mods{position:fixed;left:0;right:0;bottom:0;top:calc(var(--tabs-h) + env(safe-area-inset-top));overflow-y:auto;overscroll-behavior:contain;background:var(--bg)}
.mods-in{width:min(100%,480px);margin:0 auto;padding:8px 20px calc(28px + env(safe-area-inset-bottom))}
.overall{display:flex;align-items:center;gap:10px}
.bar{position:relative;flex:1;height:32px;border-radius:16px;background:var(--surface);overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:16px;background:var(--accent);transition:width .4s var(--ease)}
.bar span{position:relative;display:block;line-height:32px;text-align:center;font-size:14px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.reset{flex:none;width:44px;height:44px;border-radius:50%;background:var(--accent-tint);color:var(--accent);display:grid;place-items:center}
.confirm{display:flex;align-items:center;gap:8px;margin-top:10px;padding:10px 12px;border-radius:14px;background:var(--accent-tint);font-size:14px;font-weight:700;color:var(--ink)}
.confirm span{flex:1}
.confirm button{min-height:36px;padding:0 14px;border-radius:18px;font-size:14px;font-weight:800;background:var(--bg);color:var(--ink)}
.confirm button.go{background:var(--accent);color:#fff}
.search{display:flex;align-items:center;gap:10px;margin-top:14px;padding:0 16px;height:52px;border-radius:16px;background:var(--surface);color:var(--sub)}
.search input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:16px;font-weight:600;color:var(--ink);outline:none;-webkit-user-select:text;user-select:text;-webkit-appearance:none;appearance:none}
.sect{margin:24px 0 10px;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--sub)}
.mod,.hit{display:flex;align-items:center;gap:14px;width:100%;margin-bottom:12px;padding:16px;border:1px solid var(--line);border-radius:20px;background:var(--bg);text-align:left;transition:transform .15s var(--ease),background-color .15s}
.mod:active,.hit:active{transform:scale(.98);background:var(--surface)}
.badge{flex:none;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--accent-tint);color:var(--accent);font-size:20px;font-weight:800}
.mod-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.mt{font-size:18px;font-weight:800;color:var(--ink)}
.mt .wk{display:inline-block;margin-left:6px;padding:2px 8px;border-radius:999px;background:var(--accent-tint);color:var(--accent);font-size:12px;font-weight:800;vertical-align:3px}
.ms{display:flex;align-items:center;gap:4px;font-size:14px;font-weight:600;color:var(--sub)}
.ms .i{width:15px;height:15px}
.mbar{display:flex;align-items:center;gap:10px;margin-top:6px}
.mbar b{flex:1;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.mbar b i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.mod.full .mbar b i{background:var(--ok)}
.mbar span{min-width:42px;text-align:right;font-size:13px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.chev{flex:none;width:20px;height:20px;color:var(--faint)}
.hit{flex-wrap:wrap;gap:6px 10px}
.hit-t{flex:1 1 100%;font-size:16px;font-weight:700;color:var(--ink)}
.hit-m{flex:1;font-size:13px;font-weight:700;color:var(--sub)}
.empty{padding:24px 8px;text-align:center;font-size:15px;font-weight:600;color:var(--sub)}

/* Bottom sheet: technical info and the admin picker. */
.sheet-wrap{position:fixed;top:0;right:0;bottom:0;left:0;z-index:10;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.32)}
.sheet{width:min(100%,480px);max-height:84%;overflow:auto;background:#fff;border-radius:24px 24px 0 0;padding:10px 20px calc(18px + env(safe-area-inset-bottom))}
.grab{width:36px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.sheet h2{margin-bottom:12px;font-size:20px;font-weight:800}
.sheet label{display:block;margin-bottom:6px;font-size:13px;font-weight:700;color:var(--sub)}
.sheet select{display:block;width:100%;margin-bottom:14px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:15px;font-weight:600}
.sheet pre{margin:0;padding:12px;border-radius:12px;background:var(--surface);color:#3a3a3c;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere;-webkit-user-select:text;user-select:text}
.sheet .row{display:flex;gap:10px;margin-top:14px}
.sheet .row .pill{flex:1;width:auto;min-height:50px;font-size:15px}
.note{margin-top:12px;font-size:12px;line-height:1.5;color:var(--sub);text-align:center}

@keyframes pop{0%{transform:scale(.2);opacity:0}70%{transform:scale(1.18);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes nudge{0%,100%{transform:translateY(2px)}50%{transform:translateY(-3px)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-7px)}}
@keyframes dots{0%,80%,100%{opacity:.3}40%{opacity:1}}
@keyframes ask{0%,100%{box-shadow:0 0 0 0 rgba(255,90,60,.45)}60%{box-shadow:0 0 0 12px rgba(255,90,60,0)}}
@media (max-height:620px){
  .status{min-height:50px}.act{min-height:112px}.micbox{width:108px;height:108px}.mic,.halo{width:78px;height:78px}.mic .i{width:30px;height:30px}
  .bars.xl{width:120px;height:120px}.bars.lg{width:64px;height:64px}.hero h1{font-size:28px}.tw.s1{font-size:34px}.tw.s2{font-size:29px}.tw.s3{font-size:25px}.tw.s4{font-size:22px}.sum li{padding:6px 0}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main class="feed" id="feed"></main>
<nav class="tabs hide" id="tabs" aria-label="Boʻlimlar">
  <div class="tabs-in" role="tablist">
    <button class="tab on" id="tabReels" type="button" role="tab" aria-selected="true">Reels</button>
    <button class="tab" id="tabMods" type="button" role="tab" aria-selected="false">Modullar</button>
  </div>
</nav>
<section class="mods hide" id="mods" aria-label="Modullar">
  <div class="mods-in">
    <div class="overall">
      <div class="bar" id="allBar" role="img" aria-label="Umumiy natija"><i></i><span>0%</span></div>
      <button class="reset" id="reset" type="button" aria-label="Natijalarni tozalash"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M4.5 4.5v4h4"/></svg></button>
    </div>
    <div class="confirm hide" id="confirm"><span>Hamma yulduzlar oʻchadi.</span><button id="resetNo" type="button">Yoʻq</button><button class="go" id="resetYes" type="button">Tozalash</button></div>
    <label class="search"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg><input id="q" type="search" placeholder="Qidirish…" autocomplete="off" aria-label="Tez aytishni qidirish"></label>
    <div id="modList"></div>
  </div>
</section>
<div class="sheet-wrap hide" id="sheetWrap">
  <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="grab" aria-hidden="true"></div>
    <h2 id="sheetTitle">Texnik maʼlumot</h2>
    <div class="hide" id="adminBox">
      <label for="pick">Admin: shu tez aytishdan boshlash</label>
      <select id="pick"></select>
    </div>
    <pre id="diag"></pre>
    <div class="row"><button class="pill" id="copy" type="button">Nusxa olish</button><button class="pill primary" id="sheetClose" type="button">Yopish</button></div>
    <p class="note" id="note"></p>
  </section>
</div>
<audio id="voice" playsinline preload="auto"></audio>
<script>
(() => {
  'use strict';
  const API = 'https://trxnsqpdekokqvtefxlt.supabase.co/functions/v1/tez-aytish-api';
  const STAGES = ['sekin', 'orta', 'tez'];
  // sekin and o'rta are warm-ups said aloud without a check; only tez goes to the (paid) speech check.
  const WARMUP = ['sekin', 'orta'];
  const STAGE_LABEL = { sekin: 'Sekin', orta: 'Oʻrta', tez: 'Tez' };
  const STAGE_CAP = { sekin: 'boʻgʻinlab, aniq ayt', orta: 'oddiy suhbatdagidek ayt', tez: 'iloji boricha tez va aniq ayt' };
  // One sample recording per tongue twister at a normal tempo; the player slows it down for the warm-ups.
  const RATE = { sekin: 0.7, orta: 0.85, tez: 1 }, SLOW_RATE = 0.55;
  const TYPES = ['audio/webm;codecs=opus', 'audio/mp4', 'audio/mp4;codecs=mp4a.40.2', 'audio/aac', 'audio/ogg;codecs=opus', 'audio/webm'];
  const MAX_MS = 15000, SILENCE_STOP_MS = 1300, NO_SPEECH_MS = 6000, MAX_ATTEMPTS = 3, SESSION_SIZE = 5;
  // Speech detection: ignore the first 300 ms (tap, start haptic, mic click), count a loud stretch of 120 ms+ as the
  // start of speech, stop on silence only after 300 ms+ of speech, and never send less than 250 ms to the server.
  const IGNORE_MS = 300, ONSET_MS = 120, MIN_SPEECH_MS = 300, MIN_SUBMIT_MS = 250;
  const PAGE_VERSION = 'v9';
  const CONSENT_KEY = 'tez_consent_v3', PROGRESS_KEY = 'tez_progress_v1', SOUND_KEY = 'tez_sound_v1';
  const RING = 377; // circumference of the timer ring (r = 60)
  // Modules group the tongue twisters by the sound they train (ids as on the server). Month-1 plan: one module a
  // week, 5 tongue twisters, all 3 lessons of the week. A tongue twister that no module names goes to «Boshqalar».
  const MODULES = [
    { id: 'g', title: 'Gʻ va Oʻ', badge: 'Gʻ', week: '1-hafta', ids: [1, 6, 8, 11, 16] },
    { id: 'q', title: 'Q va K', badge: 'Q', week: '2-hafta', ids: [3, 5, 9, 10, 17] },

  function units(word) {

      else if ((lc === 's' || lc === 'c') && n.toLowerCase() === 'h') { out.push(c + n); i++; }

    for (let k = 0; k + 1 < v.length; k++) {

  // Split a tongue twister into words (the same ones the server judges) and the gaps between them.
  function parse(text) {

      // Punctuation right after a word stays glued to it, so a line never starts with a comma.

  // ---------- audio helpers ----------

    const pool = (early.length >= 5 ? early : frames.map((f) => f[1])).slice().sort((a, b) => a - b);
    const noise = pool.length ? pool[Math.floor(pool.length * 0.2)] : -70;
    const thr = Math.max(noise + 12, -52);
    let speechStart = null, lastLoud = null, lastAny = null, run = 0, runStart = 0;
    for (const [t, d] of frames) {
      if (t < IGNORE_MS) continue;
      if (d > thr) {
        lastAny = t;
        if (run === 0) runStart = t;
        run++;
        // Time-based, so it also works when the WebView throttles frames: a short blip never starts speech.
        if (speechStart === null && run >= 2 && t - runStart >= ONSET_MS) speechStart = runStart;
        if (speechStart !== null) lastLoud = t;
      } else run = 0;
    }
    return { noise, speechStart, lastLoud, lastAny };
  }
  // The ring fills with the time spent speaking and is full at the target time; past it the colour changes.
  function setRing(card, p) {
    part(card, 'prg').style.strokeDashoffset = String(RING * (1 - Math.max(0, Math.min(1, p))));
    part(card, 'micbox').classList.toggle('over', p > 1);
  }
  function loop() {
    if (!state.recording) return;
    const card = state.recCard, now = performance.now() - state.t0, db = measure();
    state.frames.push([Math.round(now), Math.round(db * 10) / 10]);
    part(card, 'halo').style.transform = `scale(${(1 + Math.max(0, Math.min(1, (db + 60) / 50)) * 0.24).toFixed(3)})`;
    if (now > MAX_MS) return stop('max');
    if (state.analyser) {
      const v = vad(state.frames);
      const spoke = v.speechStart !== null && v.lastLoud - v.speechStart >= MIN_SPEECH_MS;
      if (v.speechStart !== null) setRing(card, (v.lastLoud - v.speechStart) / (targetSeconds(card) * 1000));
      if (!spoke && now > NO_SPEECH_MS && now - (v.lastAny ?? 0) > SILENCE_STOP_MS) return stop('no_speech');
      if (spoke && now - v.lastLoud > SILENCE_STOP_MS) return stop('silence');
    }
    state.raf = requestAnimationFrame(loop);
  }
  async function start(card) {
    if (state.recording || state.busy || !card || !running(card) || card.stage !== 'tez' || !state.sttReady) return;
    state.error = null; state.recCard = card;
    stopVoice();
    const ctx = ensureContext(); // inside the tap, before any await (iOS)
    card.result = null; card.msg = null;
    paint(card);
    const box = part(card, 'micbox'), btn = part(card, 'mic');
    btn.disabled = true;
    setMsg(card, 'Mikrofon ochilmoqda…');
    try {
      if (typeof window.MediaRecorder === 'undefined') { const e = new Error('MediaRecorder mavjud emas'); e.name = 'NotSupportedError'; throw e; }
      releaseMic();
      const stream = await openMic();
      state.stream = stream;
      if (ctx) { state.source = ctx.createMediaStreamSource(stream); state.analyser = ctx.createAnalyser(); state.analyser.fftSize = 2048; state.source.connect(state.analyser); mic.ctxRate = ctx.sampleRate; }
      const mime = pickMime();
      let rec;
      try { rec = mime ? new MediaRecorder(stream, { mimeType: mime, audioBitsPerSecond: 64000 }) : new MediaRecorder(stream); } catch (e) { rec = new MediaRecorder(stream); }
      state.rec = rec; state.chunks = []; state.frames = []; state.mime = rec.mimeType || mime;
      rec.ondataavailable = (ev) => { if (ev.data && ev.data.size) state.chunks.push(ev.data); };
      rec.onstop = finish;
      rec.onerror = (ev) => fail(ev.error || new Error('MediaRecorder xatosi'));
      rec.start(250);
      state.recording = true; state.t0 = performance.now(); state.stopReason = '';
      btn.disabled = false; box.classList.add('rec'); btn.setAttribute('aria-label', 'Toʻxtatish');
      lockFeed(true); // no swiping away in the middle of a recording
      setMsg(card, 'Gapir… Tugatsang, yozuv oʻzi toʻxtaydi.');
      mood(card, 'listen');
      haptic('impact');
      try { if (inTelegram && tg.isVersionAtLeast('6.2')) tg.enableClosingConfirmation(); } catch (e) {}
      loop();
    } catch (e) { btn.disabled = false; fail(e); }
  }
  function stop(reason) {
    if (!state.recording) return;
    const card = state.recCard;
    state.recording = false; state.stopReason = reason || 'manual';
    cancelAnimationFrame(state.raf);
    const box = part(card, 'micbox');
    box.classList.remove('rec'); box.classList.add('busy');
    part(card, 'mic').disabled = true;
    part(card, 'halo').style.transform = '';
    setMsg(card, 'Tekshirilmoqda…');
    try { if (state.rec && state.rec.state !== 'inactive') state.rec.stop(); } catch (e) { fail(e); }
  }
  function resetMic(card) {
    lockFeed(false);
    try { if (inTelegram && tg.isVersionAtLeast('6.2')) tg.disableClosingConfirmation(); } catch (e) {}
    if (!card || !card.el) return;
    part(card, 'micbox').classList.remove('rec', 'busy', 'over');
    part(card, 'prg').style.strokeDashoffset = '';
    part(card, 'halo').style.transform = '';
    part(card, 'mic').setAttribute('aria-label', 'Gapirish');
  }
  async function finish() {
    const card = state.recCard;
    const totalMs = Math.round(performance.now() - state.t0);
    const type = (state.rec && state.rec.mimeType) || state.mime || 'audio/webm';
    const blob = new Blob(state.chunks, { type });
    const metered = !!state.analyser;
    releaseMic();
    const v = vad(state.frames);
    let peak = -100;
    for (const f of state.frames) if (f[1] > peak) peak = f[1];
    const speechMs = v.speechStart !== null && v.lastLoud !== null ? Math.max(0, v.lastLoud - v.speechStart) : 0;
    state.last = { totalMs, speechMs, peakDb: Math.round(peak), noiseDb: Math.round(v.noise), bytes: blob.size, chunks: state.chunks.length, stop: state.stopReason, type, metered };
    renderDiag();
    const quit = (text) => { resetMic(card); mood(card, 'idle'); say(card, 'warn', text); };
    if (!blob.size) return quit('Yozuv boʻsh chiqdi: mikrofon ovoz bermadi. Yana urinib koʻr.');
    if (metered && state.stopReason === 'no_speech') return quit('Ovozing eshitilmadi. Telefonni yaqinroq ushlab, yana ayt.');
    // Too little speech to check (a tap, a cough, an early stop): ask again instead of spending a check.
    if (metered && speechMs < MIN_SUBMIT_MS) return quit(speechMs ? 'Juda qisqa chiqdi. Mikrofonni bosgach, butun tez aytishni ayt.' : 'Ovozing eshitilmadi. Telefonni yaqinroq ushlab, balandroq ayt.');
    const trim = metered && v.speechStart !== null ? { start: v.speechStart - 400, end: v.lastLoud + 600 } : null;
    await submit(card, blob, trim, speechMs, totalMs);
  }
  function fail(e, quiet) {
    const card = state.recCard;
    if (state.rec) state.rec.onstop = null;
    state.recording = false; state.busy = false;
    cancelAnimationFrame(state.raf);
    releaseMic();
    const name = (e && e.name) || 'Error';
    state.error = { name, message: String((e && e.message) || e || '').slice(0, 300) };
    resetMic(card);
    if (card && card.el) { mood(card, 'idle'); if (quiet) paint(card); else say(card, 'warn', explain(name)); }
    renderDiag();
    reportMic('error');
    haptic('error');
  }
  function explain(name) {
    if (name === 'NotAllowedError' || name === 'SecurityError') return 'Mikrofonga ruxsat berilmadi. Telegram va telefon sozlamalarida mikrofonga ruxsat ber, keyin qayta urinib koʻr.';
    if (name === 'NotFoundError' || name === 'OverconstrainedError') return 'Mikrofon topilmadi. Quloqchinni tekshir yoki telefon mikrofonidan foydalan.';
    if (name === 'NotReadableError' || name === 'AbortError') return 'Mikrofon band: uni boshqa ilova ishlatayotgan boʻlishi mumkin.';
    if (name === 'NotSupportedError') return 'Bu qurilmada ovoz yozish ishlamayapti. Texnik maʼlumotni nusxalab yubor.';
    return 'Ovoz yozishda xato. Texnik maʼlumotni nusxalab yubor.';
  }

  // ---------- WAV 16 kHz mono (what the speech service accepts) ----------
  async function toWav16k(blob, trim) {
    const ctx = state.ctx || ensureContext();
    const ab = await blob.arrayBuffer();
    const decoded = await new Promise((resolve, reject) => {
      try { const p = ctx.decodeAudioData(ab, resolve, reject); if (p && p.then) p.then(resolve, reject); } catch (e) { reject(e); }
    });
    const sr = decoded.sampleRate, ch = decoded.numberOfChannels;
    let mono = new Float32Array(decoded.length);
    for (let c = 0; c < ch; c++) { const d = decoded.getChannelData(c); for (let i = 0; i < d.length; i++) mono[i] += d[i] / ch; }
    if (trim) {
      const s = Math.max(0, Math.floor((trim.start / 1000) * sr)), e = Math.min(mono.length, Math.ceil((trim.end / 1000) * sr));
      if (e - s > sr * 0.4) mono = mono.subarray(s, e);
    }
    const ratio = sr / 16000, outLen = Math.max(1, Math.floor(mono.length / ratio));
    const pcm = new Int16Array(outLen);
    for (let i = 0; i < outLen; i++) {
      const a = Math.floor(i * ratio), b = Math.max(a + 1, Math.min(mono.length, Math.floor((i + 1) * ratio)));
      let sum = 0; for (let k = a; k < b; k++) sum += mono[k];
      const v = Math.max(-1, Math.min(1, sum / (b - a)));
      pcm[i] = v < 0 ? v * 0x8000 : v * 0x7fff;
    }
    return wavBlob(pcm, 16000);
  }

  // ---------- checking ----------
  async function submit(card, blob, trim, speechMs, totalMs) {
    state.busy = true;
    let r = null, err = null;
    try {
      const wav = await toWav16k(blob, trim);
      const fd = new FormData();
      fd.append('meta', JSON.stringify({ twisterId: card.t.id, stage: card.stage, attempt: card.attempt, consent: state.consent || state.isAdmin, speechMs: Math.round(speechMs), durationMs: totalMs, platform: tg ? tg.platform : 'browser' }));
      fd.append('audio', wav, 'attempt.wav');
      r = await api('check', fd, true);
      state.lastCheck = { status: r.status, passed: r.passed, recognized: r.recognized, confidence: r.confidence, wavBytes: wav.size };
    } catch (e) { err = e; state.lastCheck = { error: e.message }; }
    state.busy = false;
    resetMic(card);
    mood(card, 'idle');
    if (r) showCheck(card, r, speechMs);
    else if (err.code === 'speech_not_configured') say(card, 'warn', 'Ovozli tekshiruv hali ulanmagan. Birozdan keyin urinib koʻr.');
    else if (err.code === 'invalid_or_expired_init_data') say(card, 'warn', 'Sessiya eskirdi: Mini Appʼni yopib, qayta och.');
    else if (err.code === 'consent_required') { state.consent = false; store.set(CONSENT_KEY, false); paint(card); welcome('consent'); go(state.welcomeEl); }
    else say(card, 'warn', `Tekshirib boʻlmadi (${err.message}). Yana urinib koʻr.`);
    renderDiag();
  }

  // The result is shown in the tongue twister itself: right words turn green, a slip gets a soft yellow marker
  // with what was heard below it. Stars: first try 3, second 2, third 1.
  function showCheck(card, r, speechMs) {
    if (r.status && r.status !== 'Success') { haptic('warning'); return say(card, 'warn', 'Ovozing aniq eshitilmadi. Telefonni yaqinroq ushlab, yana ayt.'); }
    card.result = Array.isArray(r.words) ? r.words : [];
    for (const w of card.result) if (w.v === 'wrong' || w.v === 'missing') card.hard.add(w.d || w.t);
    const target = targetSeconds(card);
    const tooSlow = !!r.passed && speechMs / 1000 > target;
    if (r.passed && !tooSlow) {
      const stars = Math.max(1, MAX_ATTEMPTS + 1 - card.attempt);
      const near = card.result.some((w) => w.v === 'near');
      complete(card, stars);
      say(card, 'ok', near ? 'Toʻgʻri! Tagiga chizilgan soʻzni yana aniqroq ayt.' : 'Barakalla! Hammasi toʻgʻri.');
      mood(card, 'happy', 2600);
      sfx('win', stars);
      haptic('success');
      return;
    }
    card.attempt += 1;
    const left = MAX_ATTEMPTS + 1 - card.attempt;
    mood(card, 'wink', 2600);
    sfx('soft');
    haptic('warning');
    if (left <= 0) {
      if (card.again) { card.again = false; return say(card, 'warn', 'Hozircha shu natija qoladi. Keyinroq yana urinib koʻr.'); }
      complete(card, 0, true);
      return say(card, 'warn', 'Bu tez aytishga keyinroq qaytamiz. Keyingisiga oʻt!');
    }
    say(card, 'warn', tooSlow ? `Soʻzlar toʻgʻri! Endi tezroq ayt: ${fmt(speechMs / 1000)} s, maqsad ${fmt(target)} s.` : `Deyarli! Sariq soʻzlarga eʼtibor ber. Yana ${left} ta urinish bor.`);
  }

  // ---------- sheet, diagnostics ----------
  function fillPicker() {
    const sel = $('pick');
    sel.innerHTML = '';
    state.twisters.forEach((t, i) => {
      const o = document.createElement('option');
      o.value = String(i);
      o.textContent = `${i + 1}. ${t.text.length > 44 ? t.text.slice(0, 42) + '…' : t.text}`;
      sel.appendChild(o);
    });
    $('adminBox').classList.remove('hide');
  }
  function openSheet() {
    renderDiag();
    if (state.cards.length) $('pick').value = String(state.cards[0].ti);
    $('sheetWrap').classList.remove('hide');
  }
  function closeSheet() { $('sheetWrap').classList.add('hide'); }
  function haptic(kind) {
    try {
      if (!inTelegram || !tg.HapticFeedback) return;
      if (kind === 'impact') tg.HapticFeedback.impactOccurred('medium');
      else if (kind === 'light') tg.HapticFeedback.impactOccurred('light');
      else tg.HapticFeedback.notificationOccurred(kind);
    } catch (e) {}
  }
  function diagnostics() {
    const card = cur() || state.recCard;
    return { pageVersion: PAGE_VERSION, inTelegram, mock, platform: tg ? tg.platform : null, tgVersion: tg ? tg.version : null, secure: window.isSecureContext,
      getUserMedia: !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia), mediaRecorder: typeof window.MediaRecorder !== 'undefined',
      types: supported(), chosen: state.mime || pickMime(), mic, last: state.last, error: state.error, check: state.lastCheck,
      twisterId: card ? card.t.id : null, stage: card ? card.stage : null, attempt: card ? card.attempt : null,
      sound: state.sound, voiceLocked: state.voiceLocked, samples: state.twisters.filter((t) => t.audio).length };
  }
  function renderDiag() {
    const d = diagnostics();
    const okTypes = Object.keys(d.types).filter((t) => d.types[t]);
    const L = state.last, C = state.lastCheck;
    $('diag').textContent = [
      `Sahifa: ${PAGE_VERSION}`,
      `Telegram: ${d.inTelegram ? `${d.platform} v${d.tgVersion}` : mock ? 'mock rejimi' : 'yoʻq (oddiy brauzer)'}`,
      `Brauzer: ${navigator.userAgent}`,
      `getUserMedia: ${d.getUserMedia ? 'ha' : 'yoʻq'} · MediaRecorder: ${d.mediaRecorder ? 'ha' : 'yoʻq'} · format: ${d.chosen || 'standart'}`,
      `Qoʻllaydi: ${okTypes.join(', ') || 'hech biri'}`,
      mic.sampleRate || mic.ctxRate ? `Mikrofon: ${mic.sampleRate || '?'} Hz, EC ${flag(mic.echoCancellation)}, NS ${flag(mic.noiseSuppression)}, AGC ${flag(mic.autoGainControl)}, AudioContext ${mic.ctxRate || '?'} Hz` : 'Mikrofon: hali ochilmagan',
      L ? `Oxirgi yozuv: ${L.totalMs} ms, nutq ${L.speechMs} ms, peak ${L.peakDb} dB, ${L.bytes} bayt, toʻxtash: ${L.stop}` : 'Oxirgi yozuv: yoʻq',
      C ? `Tekshiruv: ${C.error ? 'xato ' + C.error : `${C.status}, passed=${C.passed}, ishonch ${C.confidence}, WAV ${C.wavBytes} bayt`}` : 'Tekshiruv: yoʻq',
      state.error ? `Xato: ${state.error.name}: ${state.error.message}` : 'Xato: yoʻq',
      `Server: ${state.server || '—'} · aniqlash: ${state.sttReady ? state.provider || 'ulangan' : 'ulanmagan'} · diktor: ${d.samples} ta yozuv, ovoz ${d.sound ? 'yoqilgan' : 'oʻchirilgan'}${d.voiceLocked ? ', avto-ovoz bloklangan' : ''}`,
    ].join('\n');
  }
  function reportMic(outcome) {
    if (!inTelegram) return;
    const fd = new FormData();
    fd.append('meta', JSON.stringify({ outcome, platform: tg.platform, tgVersion: tg.version, userAgent: navigator.userAgent, mimeType: state.mime || pickMime(), diagnostics: diagnostics() }));
    fetch(`${API}/mic-check`, { method: 'POST', headers: { 'x-telegram-init-data': tg.initData }, body: fd }).catch(() => {});
  }

  // ---------- start ----------
  async function init() {
    buildWelcome();
    paintTotals();
    renderDiag();
    if (!inTelegram && !mock) return welcome('info', 'Bu trenajyor Telegram ichida ishlaydi. Uni botdagi tugma orqali och.');
    try {
      const s = await api('session');
      state.isAdmin = !!s.isAdmin; state.sttReady = !!(s.sttReady ?? s.speechReady); state.provider = s.sttProvider || '';
      state.twisters = Array.isArray(s.twisters) ? s.twisters : [];
      state.server = 'ok';
    } catch (e) {
      state.server = `xato: ${e.message}`;
      renderDiag();
      return welcome('error', e.code === 'invalid_or_expired_init_data' ? 'Sessiya eskirdi: Mini Appʼni yopib, qayta och.' : `Serverga ulanib boʻlmadi (${e.message}). Internetni tekshirib, qayta urinib koʻr.`);
    }
    document.body.classList.toggle('is-admin', state.isAdmin);
    $('note').textContent = state.isAdmin ? 'Admin rejimi: yozuvlar sozlash uchun saqlanadi.' : 'Ovoz yozuvi saqlanmaydi, faqat natija yoziladi.';
    // While the trainer is closed for children they get a friendly 'coming soon' instead of a mic that cannot check.
    if (!state.sttReady && !state.isAdmin) return welcome('soon');
    if (!state.twisters.length) return welcome('info', 'Tez aytishlar roʻyxati boʻsh.');
    if (state.isAdmin) fillPicker();
    if (!state.isAdmin && !state.consent) return welcome('consent');
    newSession(dailyList(state.progress.idx));
    welcome('ready');
    reportMic('opened');
    renderDiag();
  }

  // ---------- events ----------
  feed.addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    ensureContext(); // sounds need a context that was started inside a tap
    const act = b.dataset.act, card = cardOf(b);
    if (act === 'sound') return toggleSound();
    if (act === 'sheet') return openSheet();
    if (state.recording) { if (act === 'mic') stop('manual'); return; }
    if (state.busy) return;
    if (act === 'begin') return begin();
    if (act === 'consent') return acceptConsent();
    if (act === 'reload') return location.reload();
    if (act === 'again') return restart();
    if (act === 'tomods') return setView('mods');
    if (!card) return;
    if (act === 'play') return manualPlay(card, RATE[card.stage]);
    if (act === 'slow') return manualPlay(card, SLOW_RATE);
    if (act === 'stage') return jumpStage(card, b.dataset.stage);
    if (act === 'said') return said(card);
    if (act === 'mic') return start(card);
    if (act === 'next') return goNext(card);
    if (act === 'retry') return improve(card);
  });
  // A swipe up on a card that is not finished yet cannot go anywhere: nudge the hint instead.
  let touchY = null;
  feed.addEventListener('touchstart', (e) => { touchY = e.touches[0].clientY; }, { passive: true });
  feed.addEventListener('touchend', (e) => {
    if (touchY === null) return;
    const dy = e.changedTouches[0].clientY - touchY;
    touchY = null;
    const card = cur();
    if (dy > -60 || !card || card.done || state.recording || state.busy) return;
    if (feed.scrollTop + feed.clientHeight >= feed.scrollHeight - 2) nudge(card);
  }, { passive: true });
  $('tabReels').addEventListener('click', () => setView('reels'));
  $('tabMods').addEventListener('click', () => setView('mods'));
  $('modList').addEventListener('click', (e) => {
    const b = e.target.closest('[data-mod]');
    if (!b) return;
    ensureContext(); // sounds and the sample need a tap to start
    openModule(b.dataset.mod, b.dataset.tw);
  });
  $('q').addEventListener('input', () => renderModules());
  $('reset').addEventListener('click', () => $('confirm').classList.toggle('hide'));
  $('resetNo').addEventListener('click', () => $('confirm').classList.add('hide'));
  $('resetYes').addEventListener('click', () => { $('confirm').classList.add('hide'); resetProgress(); });
  $('sheetWrap').addEventListener('click', (e) => { if (e.target === $('sheetWrap')) closeSheet(); });
  $('sheetClose').addEventListener('click', closeSheet);
  $('pick').addEventListener('change', (e) => {
    if (state.recording || state.busy) return;
    newSession(dailyList(Number(e.target.value) || 0));
    welcome('ready');
    closeSheet();
    setView('reels');
    go(state.cards[0].el);
  });
  $('copy').addEventListener('click', async () => {
    const text = $('diag').textContent;
    let ok = false;
    try { await navigator.clipboard.writeText(text); ok = true; } catch (e) {
      const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select(); try { ok = document.execCommand('copy'); } catch (e2) {} ta.remove();
    }
    $('copy').textContent = ok ? 'Nusxa olindi ✓' : 'Nusxa olinmadi';
    setTimeout(() => { $('copy').textContent = 'Nusxa olish'; }, 2500);
  });
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) return;
    stopVoice();
    if (state.recording) stop('hidden'); else releaseMic();
  });

  $('voice').addEventListener('timeupdate', () => { if (state.vdraw) state.vdraw(); });
  $('voice').addEventListener('ended', () => { if (state.voiceCard) stopVoice(true); });

  if (mock) window.__tez = { state, toWav16k, vad, syllables, parse, modulesNow, setView }; // local preview tests only
  init();
})();
</script>
