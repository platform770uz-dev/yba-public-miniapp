<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#ffffff">
<title>Tez aytish — trenajyor</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#fff;--surface:#f5f5f7;--ink:#1d1d1f;--sub:#6e6e73;--faint:#b0b0b6;--line:#e5e5ea;--accent:#ff5a3c;--accent-press:#e8492c;--accent-tint:#ffebe6;--ok:#1e8e3e;--warn:#8a5a00;--warn-tint:#fff1cc;--warn-line:#f0b429;--star:#f5a623;--ease:cubic-bezier(.2,.8,.2,1);--tabs-h:62px}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);overscroll-behavior:none}
body{color:var(--ink);font-family:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.4;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;border:0;background:none;padding:0}
button:focus-visible{outline:3px solid #0a84ff;outline-offset:3px}
button:disabled{opacity:.45;cursor:default}
h1,h2,p,ul{margin:0}
.hide{display:none!important}
.i{display:block;width:22px;height:22px}

/* The feed: one full-screen card per tongue twister, swiped vertically like Reels. */
.feed{position:fixed;top:0;right:0;bottom:0;left:0;overflow-y:auto;overflow-x:hidden;scroll-snap-type:y mandatory;overscroll-behavior:none;scrollbar-width:none}
.feed::-webkit-scrollbar{display:none}
.feed.lock{overflow:hidden}
.feed.away{visibility:hidden}
body.tabs-on .feed{top:calc(var(--tabs-h) + env(safe-area-inset-top))}
body.tabs-on .card{padding-top:8px}
.card{position:relative;height:100%;width:min(100%,480px);margin:0 auto;scroll-snap-align:start;scroll-snap-stop:always;display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top)) 20px calc(12px + env(safe-area-inset-bottom))}

/* Stage segments on top, like Stories. */
.segs{display:flex;gap:5px}
.seg{flex:1;height:22px;display:flex;align-items:center}
.seg i{display:block;width:100%;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.seg b{display:block;height:100%;width:0;border-radius:2px;background:var(--accent)}
.seg.on i{background:var(--accent-tint)}
.seg.done b{width:100%}
.seglab{display:flex;gap:5px;margin-top:-3px}
.seglab span{flex:1;font-size:12px;font-weight:700;color:var(--faint)}
.seglab span.on{color:var(--accent)}
.seglab span.done{color:var(--sub)}
.meta{display:flex;align-items:center;gap:4px;margin-top:6px;min-height:40px;font-size:14px;font-weight:700;color:var(--sub);font-variant-numeric:tabular-nums}
.meta .sp{flex:1}
.brand{font-size:16px;font-weight:800;color:var(--ink)}
.total{display:inline-flex;align-items:center;gap:4px;color:var(--ink);margin-right:4px}
.total .i{width:17px;height:17px}
.star path{fill:var(--star);stroke:var(--star);stroke-width:1.6;stroke-linejoin:round}
.ico{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink)}
.ico:active{background:var(--surface)}
.admin-only{display:none}
.is-admin .admin-only{display:grid}

/* Text and the side rail. */
.box{flex:1;min-height:0;display:flex;align-items:center;gap:12px}
.body{flex:1;min-width:0}
.cap{margin-bottom:10px;font-size:14px;font-weight:600;color:var(--sub)}
.cap b{color:var(--accent);font-weight:800}
.tw{font-weight:800;letter-spacing:-.02em;line-height:1.3;font-size:34px}
.tw.s1{font-size:42px}.tw.s2{font-size:34px}.tw.s3{font-size:29px}.tw.s4{font-size:25px}
.w{display:inline-block;max-width:100%;overflow-wrap:anywhere;vertical-align:top;border-bottom:3px solid transparent;border-radius:8px;transition:background-color .15s,box-shadow .15s,color .2s}
.w u{text-decoration:none}
.hs{font-weight:inherit;color:var(--accent)}
.sy{font-style:normal;font-weight:500;color:var(--faint);margin:0 .03em}
.w.on{background:var(--accent-tint);box-shadow:0 0 0 4px var(--accent-tint)}
.tw.res .hs{color:inherit}
.w.ok,.w.near{color:var(--ok)}
.w.near{border-bottom:3px dotted var(--warn-line);border-radius:0}
.w.wrong{color:var(--warn);background:var(--warn-tint);box-shadow:0 0 0 4px var(--warn-tint)}
.w.missing{color:var(--faint);border-bottom:3px dashed var(--faint);border-radius:0}
.w small{display:block;margin-top:1px;font-size:13px;line-height:1.2;font-weight:700;letter-spacing:0}
.rail{flex:none;display:flex;flex-direction:column;align-items:center;gap:12px}
.rb{width:46px;height:46px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:21px;line-height:1;transition:transform .15s var(--ease),background-color .15s,color .15s}
.rb:active{transform:scale(.93)}
.rb.on{background:var(--accent-tint);color:var(--accent)}
.rb.ask{animation:ask 1.1s var(--ease) 3}

/* The snow leopard. */
.bars svg{display:block;width:100%;height:100%}
.bars.sm{width:50px;height:50px;border-radius:50%;background:var(--accent-tint);padding:3px}
.bars.lg{width:92px;height:92px;flex:none}
.bars.xl{width:164px;height:164px;flex:none}
.bars .e-happy,.bars .e-wink,.bars .m-open{display:none}
.bars .e-open{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
.bars[data-mood=happy] .e-open,.bars[data-mood=happy] .m-smile{display:none}
.bars[data-mood=happy] .e-happy,.bars[data-mood=happy] .m-open{display:inline}
.bars[data-mood=happy]{animation:hop .5s var(--ease) 2}
.bars[data-mood=wink] .e-open.r{display:none}
.bars[data-mood=wink] .e-wink{display:inline}
.bars[data-mood=listen] .e-open{animation:none;transform:scale(1.18)}

/* Status line, action zone, foot. */
.status{min-height:62px;margin-top:8px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;text-align:center}
.stars{display:flex;gap:6px}
.stars svg{width:30px;height:30px}
.stars path,.st path{fill:var(--line);stroke:var(--line);stroke-width:1.6;stroke-linejoin:round}
.stars .f path,.st .f path{fill:var(--star);stroke:var(--star)}
.stars .a{animation:pop .4s var(--ease) both}
.msg{font-size:15px;line-height:1.35;font-weight:700;color:var(--sub);max-width:310px}
.msg.ok{color:var(--ok)}
.msg.warn{color:var(--warn)}
.act{min-height:134px;margin-top:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.pill{width:min(100%,300px);min-height:56px;padding:0 26px;border-radius:28px;background:var(--surface);color:var(--ink);font-size:17px;font-weight:800;transition:transform .15s var(--ease),background-color .15s}
.pill:active{transform:scale(.97)}
.pill.primary{background:var(--accent);color:#fff}
.pill.primary:active{background:var(--accent-press)}
.pill.small{width:auto;min-height:44px;font-size:15px}
.micbox{position:relative;width:128px;height:128px;display:grid;place-items:center}
.ring{position:absolute;top:0;left:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:7}
.ring .trk{stroke:var(--accent-tint)}
.ring .prg{stroke:var(--accent);stroke-linecap:round;stroke-dasharray:377;stroke-dashoffset:377;transition:stroke .2s}
.micbox.over .prg{stroke:var(--warn-line)}
.halo{position:absolute;width:92px;height:92px;border-radius:50%;background:var(--accent-tint);transition:transform .09s linear}
.mic{position:relative;width:92px;height:92px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;transition:transform .15s var(--ease),background-color .15s}
.mic:active{transform:scale(.96);background:var(--accent-press)}
.mic .i{width:36px;height:36px;grid-area:1/1}
.mic .i-stop,.mic .i-dots{display:none}
.micbox.rec .i-mic{display:none}
.micbox.rec .i-stop{display:block}
.micbox.busy .i-mic,.micbox.busy .i-stop{display:none}
.micbox.busy .i-dots{display:block}
.i-dots circle{animation:dots 1.1s infinite}
.i-dots circle:nth-child(2){animation-delay:.15s}
.i-dots circle:nth-child(3){animation-delay:.3s}
.foot{margin-top:6px;min-height:24px;display:flex;align-items:center;justify-content:center;gap:5px;font-size:13px;font-weight:600;color:var(--sub);text-align:center}
.foot .i{width:16px;height:16px}
.foot.up{color:var(--ink)}
.foot.up .i{animation:nudge 1.4s var(--ease) infinite}
.foot.shake{animation:shake .4s}
.link{font-size:13px;font-weight:600;color:var(--sub);text-decoration:underline;text-underline-offset:3px;padding:6px 8px}

/* Welcome and summary cards. */
.hero{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.hero h1{margin-top:8px;font-size:34px;line-height:1.15;font-weight:800;letter-spacing:-.02em}
.lead{font-size:17px;line-height:1.45;font-weight:500;color:var(--sub);max-width:310px}
.consent .lead{font-size:15px}
.summary .hero{justify-content:flex-start;gap:6px;overflow-y:auto;overscroll-behavior:contain;padding-top:4px}
.summary .hero h1{font-size:28px;margin-top:2px}
.summary .lead{font-size:15px}
.sum{list-style:none;padding:0;width:100%;margin-top:6px}
.sum li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px;font-weight:600}
.sum li>span:first-child{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.st{display:flex;gap:2px;flex:none}
.st svg{width:17px;height:17px}
.hard{width:100%;margin-top:10px;text-align:left}
.hard p{margin-bottom:7px;font-size:13px;font-weight:700;color:var(--sub)}
.chip{display:inline-block;margin:0 6px 6px 0;padding:5px 10px;border-radius:10px;background:var(--warn-tint);color:var(--warn);font-size:14px;font-weight:700}

/* Tabs on top (Reels | Modullar) and the modules screen. */
.tabs{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;justify-content:center;padding:calc(8px + env(safe-area-inset-top)) 16px 6px;background:var(--bg)}
.tabs-in{display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--surface)}
.tab{min-width:112px;min-height:40px;padding:0 18px;border-radius:999px;font-size:15px;font-weight:800;color:var(--sub);transition:background-color .15s,color .15s}
.tab.on{background:var(--bg);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.mods{position:fixed;left:0;right:0;bottom:0;top:calc(var(--tabs-h) + env(safe-area-inset-top));overflow-y:auto;overscroll-behavior:contain;background:var(--bg)}
.mods-in{width:min(100%,480px);margin:0 auto;padding:8px 20px calc(28px + env(safe-area-inset-bottom))}
.overall{display:flex;align-items:center;gap:10px}
.bar{position:relative;flex:1;height:32px;border-radius:16px;background:var(--surface);overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:16px;background:var(--accent);transition:width .4s var(--ease)}
.bar span{position:relative;display:block;line-height:32px;text-align:center;font-size:14px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.reset{flex:none;width:44px;height:44px;border-radius:50%;background:var(--accent-tint);color:var(--accent);display:grid;place-items:center}
.confirm{display:flex;align-items:center;gap:8px;margin-top:10px;padding:10px 12px;border-radius:14px;background:var(--accent-tint);font-size:14px;font-weight:700;color:var(--ink)}
.confirm span{flex:1}
.confirm button{min-height:36px;padding:0 14px;border-radius:18px;font-size:14px;font-weight:800;background:var(--bg);color:var(--ink)}
.confirm button.go{background:var(--accent);color:#fff}
.search{display:flex;align-items:center;gap:10px;margin-top:14px;padding:0 16px;height:52px;border-radius:16px;background:var(--surface);color:var(--sub)}
.search input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:16px;font-weight:600;color:var(--ink);outline:none;-webkit-user-select:text;user-select:text;-webkit-appearance:none;appearance:none}
.sect{margin:24px 0 10px;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--sub)}
.mod,.hit{display:flex;align-items:center;gap:14px;width:100%;margin-bottom:12px;padding:16px;border:1px solid var(--line);border-radius:20px;background:var(--bg);text-align:left;transition:transform .15s var(--ease),background-color .15s}
.mod:active,.hit:active{transform:scale(.98);background:var(--surface)}
.badge{flex:none;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--accent-tint);color:var(--accent);font-size:20px;font-weight:800}
.mod-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.mt{font-size:18px;font-weight:800;color:var(--ink)}
.mt .wk{display:inline-block;margin-left:6px;padding:2px 8px;border-radius:999px;background:var(--accent-tint);color:var(--accent);font-size:12px;font-weight:800;vertical-align:3px}
.ms{display:flex;align-items:center;gap:4px;font-size:14px;font-weight:600;color:var(--sub)}
.ms .i{width:15px;height:15px}
.mbar{display:flex;align-items:center;gap:10px;margin-top:6px}
.mbar b{flex:1;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.mbar b i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.mod.full .mbar b i{background:var(--ok)}
.mbar span{min-width:42px;text-align:right;font-size:13px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.chev{flex:none;width:20px;height:20px;color:var(--faint)}
.hit{flex-wrap:wrap;gap:6px 10px}
.hit-t{flex:1 1 100%;font-size:16px;font-weight:700;color:var(--ink)}
.hit-m{flex:1;font-size:13px;font-weight:700;color:var(--sub)}
.empty{padding:24px 8px;text-align:center;font-size:15px;font-weight:600;color:var(--sub)}

/* Bottom sheet: technical info and the admin picker. */
.sheet-wrap{position:fixed;top:0;right:0;bottom:0;left:0;z-index:10;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.32)}
.sheet{width:min(100%,480px);max-height:84%;overflow:auto;background:#fff;border-radius:24px 24px 0 0;padding:10px 20px calc(18px + env(safe-area-inset-bottom))}
.grab{width:36px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.sheet h2{margin-bottom:12px;font-size:20px;font-weight:800}
.sheet label{display:block;margin-bottom:6px;font-size:13px;font-weight:700;color:var(--sub)}
.sheet select{display:block;width:100%;margin-bottom:14px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:15px;font-weight:600}
.sheet pre{margin:0;padding:12px;border-radius:12px;background:var(--surface);color:#3a3a3c;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere;-webkit-user-select:text;user-select:text}
.sheet .row{display:flex;gap:10px;margin-top:14px}
.sheet .row .pill{flex:1;width:auto;min-height:50px;font-size:15px}
.note{margin-top:12px;font-size:12px;line-height:1.5;color:var(--sub);text-align:center}

/* Teacher mode: groups, students, the week's module, a student's lesson and the reports. */
.teach{position:fixed;top:0;right:0;bottom:0;left:0;z-index:4;overflow-y:auto;overscroll-behavior:contain;background:var(--bg)}
.teach-in{width:min(100%,480px);margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 20px calc(28px + env(safe-area-inset-bottom))}
body.t-busy .teach-in{opacity:.55;pointer-events:none}
.t-head{display:flex;align-items:center;gap:12px;margin:6px 0 2px}
.t-top{display:flex;align-items:center;gap:4px;min-height:44px;margin-top:2px}
.t-top .t-title{flex:1;min-width:0}
.t-back{flex:none;width:40px;height:40px;margin-left:-10px;border-radius:50%;display:grid;place-items:center}
.t-back:active{background:var(--surface)}
.t-title{font-size:24px;line-height:1.2;font-weight:800;letter-spacing:-.01em;overflow-wrap:anywhere}
.t-sub{margin-top:4px;font-size:14px;font-weight:600;color:var(--sub)}
.t-sub a{color:var(--accent);font-weight:700}
.t-msg{margin:12px 0 0;padding:10px 12px;border-radius:12px;background:var(--warn-tint);color:var(--warn);font-size:14px;font-weight:700}
.t-card{margin-top:14px;padding:16px;border-radius:20px;background:var(--surface)}
.t-k{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--sub)}
.t-big{margin-top:4px;font-size:20px;font-weight:800}
.t-big.warn{color:var(--warn)}
.t-big.ok{color:var(--ok)}
.t-list{margin:10px 0 0;padding-left:20px;font-size:15px;font-weight:600;line-height:1.45}
.t-list small{color:var(--warn);font-weight:700}
.t-hw{margin-top:8px;font-size:14px;font-weight:600;color:var(--sub)}
.t-link{display:block;margin-top:12px;font-size:14px;font-weight:700;color:var(--accent);text-align:left}
.t-weeks{display:flex;gap:10px;margin-top:12px}
.t-week{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:800;color:var(--sub)}
.t-week small{font-weight:600}
.t-week select,.t-form input:not([type=checkbox]),.t-form select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:16px;font-weight:600;-webkit-user-select:text;user-select:text}
.t-row{display:flex;align-items:center;gap:10px;min-height:56px;border-bottom:1px solid var(--line)}
.t-name{flex:1;min-width:0;padding:10px 0;text-align:left;font-size:16px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t-name small{font-weight:600;color:var(--sub)}
.t-chip{flex:none;padding:6px 10px;border-radius:10px;background:var(--surface);font-size:13px;font-weight:800;color:var(--sub)}
.t-chip.ok{background:#e6f4ea;color:var(--ok)}
.t-chip.warn{background:var(--warn-tint);color:var(--warn)}
.t-start{flex:none;min-height:40px;padding:0 16px;border-radius:20px;background:var(--accent);color:#fff;font-size:14px;font-weight:800}
.t-start:active{background:var(--accent-press)}
.t-btn{flex:none;min-height:36px;padding:0 12px;border-radius:18px;background:var(--surface);font-size:13px;font-weight:800}
.t-btn.go{background:var(--accent);color:#fff}
.t-wide{display:block;width:100%;margin-top:14px}
.t-foot{display:flex;justify-content:center;gap:8px;margin-top:18px}
.t-line.warn{color:var(--warn)}
.t-form{display:flex;flex-direction:column;gap:14px;margin-top:10px}
.t-form label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:800;color:var(--sub)}
.t-lab{font-size:13px;font-weight:800;color:var(--sub)}
.t-days{display:flex;gap:6px;margin-top:-8px}
.t-form .t-day{display:block;flex:1;position:relative}
.t-day input{position:absolute;opacity:0;pointer-events:none}
.t-day span{display:grid;place-items:center;height:44px;border-radius:12px;background:var(--surface);font-size:14px;font-weight:800;color:var(--sub)}
.t-day input:checked+span{background:var(--accent);color:#fff}
.t-form .t-check{flex-direction:row;align-items:flex-start;gap:10px;font-size:14px;font-weight:600;color:var(--ink)}
.t-check input{width:22px;height:22px;flex:none;margin:1px 0 0;accent-color:var(--accent)}
.t-wrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;font-weight:600}
.t-wrow span:first-child{flex:1}
.t-rep{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;padding:10px 0;border-bottom:1px solid var(--line);text-align:left}
.t-rs{font-size:13px;font-weight:600;color:var(--sub)}

@keyframes pop{0%{transform:scale(.2);opacity:0}70%{transform:scale(1.18);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes nudge{0%,100%{transform:translateY(2px)}50%{transform:translateY(-3px)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-7px)}}
@keyframes dots{0%,80%,100%{opacity:.3}40%{opacity:1}}

<script>
(() => {
  'use strict';
  const API = 'https://trxnsqpdekokqvtefxlt.supabase.co/functions/v1/tez-aytish-api';
  const STAGES = ['sekin', 'orta', 'tez'];
  // sekin and o'rta are warm-ups said aloud without a check; only tez goes to the (paid) speech check.
  const WARMUP = ['sekin', 'orta'];
  const STAGE_LABEL = { sekin: 'Sekin', orta: 'Oʻrta', tez: 'Tez' };
  const STAGE_CAP = { sekin: 'boʻgʻinlab, aniq ayt', orta: 'oddiy suhbatdagidek ayt', tez: 'iloji boricha tez va aniq ayt' };
  // One sample recording per tongue twister at a normal tempo; the player slows it down for the warm-ups.
  const RATE = { sekin: 0.7, orta: 0.85, tez: 1 }, SLOW_RATE = 0.55;
  const TYPES = ['audio/webm;codecs=opus', 'audio/mp4', 'audio/mp4;codecs=mp4a.40.2', 'audio/aac', 'audio/ogg;codecs=opus', 'audio/webm'];
  // One voice check per tongue twister; after it the feed moves to the next card by itself after AUTO_NEXT_MS.
  const MAX_MS = 15000, SILENCE_STOP_MS = 1300, NO_SPEECH_MS = 6000, SESSION_SIZE = 5, AUTO_NEXT_MS = 2600;
  // Speech detection: ignore the first 300 ms (tap, start haptic, mic click), count a loud stretch of 120 ms+ as the
  // start of speech, stop on silence only after 300 ms+ of speech, and never send less than 250 ms to the server.
  const IGNORE_MS = 300, ONSET_MS = 120, MIN_SPEECH_MS = 300, MIN_SUBMIT_MS = 250;
  const PAGE_VERSION = 'v11';
  const CONSENT_KEY = 'tez_consent_v3', PROGRESS_KEY = 'tez_progress_v1', SOUND_KEY = 'tez_sound_v1';
  const RING = 377; // circumference of the timer ring (r = 60)
  // Modules group the tongue twisters by the sound they train (ids as on the server). Month-1 plan: one module a
  // week, 5 tongue twisters, all 3 lessons of the week. A tongue twister that no module names goes to «Boshqalar».
  const MODULES = [
    { id: 'g', title: 'Gʻ va Oʻ', badge: 'Gʻ', week: '1-hafta', ids: [1, 6, 8, 11, 16] },
    { id: 'q', title: 'Q va K', badge: 'Q', week: '2-hafta', ids: [3, 5, 9, 10, 17] },
    { id: 'sh', title: 'Sh va Ch', badge: 'Sh', week: '3-hafta', ids: [7, 12, 15, 18, 19] },
    { id: 'r', title: 'R, S va X', badge: 'R', week: '4-hafta', ids: [2, 4, 13, 14, 20] },
  ];

  const $ = (id) => document.getElementById(id);
  const feed = $('feed');
  const tg = window.Telegram && window.Telegram.WebApp;
  const inTelegram = !!(tg && tg.initData);
  const query = new URLSearchParams(location.search);
  const mock = !inTelegram && query.has('mock');

  const store = {
    get(key, fallback) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; } },
    set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {} },
  };

  const state = {
    isAdmin: false, sttReady: false, provider: '', twisters: [], cards: [], mod: null, view: 'reels',
    welcomeEl: null, summaryEl: null, activeEl: null,
    consent: !!store.get(CONSENT_KEY, false), sound: store.get(SOUND_KEY, true) !== false,
    progress: store.get(PROGRESS_KEY, { idx: 0, stars: {}, later: [] }),
    voiceCard: null, voiceRate: 1, voiceLocked: false, vraf: 0, vdraw: null,
    ctx: null, stream: null, source: null, analyser: null, rec: null, recCard: null, chunks: [], frames: [],
    t0: 0, raf: 0, recording: false, busy: false, stopReason: '', mime: '', last: null, error: null, server: '', lastCheck: null,
  };
  if (!state.progress || typeof state.progress !== 'object') state.progress = { idx: 0, stars: {}, later: [] };
  if (!state.progress.stars) state.progress.stars = {};
  if (!Array.isArray(state.progress.later)) state.progress.later = [];
  let mic = {};

  if (tg) {
    try { tg.ready(); tg.expand(); } catch (e) {}
    if (inTelegram) {
      try { if (tg.isVersionAtLeast('6.1')) { tg.setHeaderColor('#ffffff'); tg.setBackgroundColor('#ffffff'); } } catch (e) {}
      // Vertical swipes belong to the feed, not to closing the Mini App.
      try { if (tg.isVersionAtLeast('7.7')) tg.disableVerticalSwipes(); } catch (e) {}
    }
  }

  const fmt = (n) => (Math.round(n * 10) / 10).toFixed(1).replace('.', ',');
  const flag = (v) => (v === true ? 'on' : v === false ? 'off' : '?');
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const words = (text) => text.replace(/[.,!?;:—–-]/g, ' ').split(/\s+/).filter(Boolean).length;

  // ---------- icons and the mascot ----------
  const LINE = 'fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"';
  const icon = (cls, body, attrs) => `<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true" ${attrs || ''}>${body}</svg>`;
  const STAR_PATH = '<path d="M12 3.2l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.8 6.6 19.7l1.2-6L3.3 9.5l6.1-.7z"/>';
  const ICON = {
    play: icon('', '<path fill="currentColor" d="M8 5.6v12.8a1 1 0 0 0 1.5.9l10.4-6.4a1 1 0 0 0 0-1.8L9.5 4.7A1 1 0 0 0 8 5.6z"/>'),
    mic: icon('i-mic', '<rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3"/>', LINE),
    stop: icon('i-stop', '<rect x="6.5" y="6.5" width="11" height="11" rx="2.5" fill="currentColor"/>'),
    dots: icon('i-dots', '<circle cx="5" cy="12" r="2.2"/><circle cx="12" cy="12" r="2.2"/><circle cx="19" cy="12" r="2.2"/>', 'fill="currentColor"'),
    sound: icon('', '<path d="M4 9.5v5h3.5l4.5 4v-13l-4.5 4z" fill="currentColor"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.6 7.6 0 0 1 0 11"/>', LINE),
    mute: icon('', '<path d="M4 9.5v5h3.5l4.5 4v-13l-4.5 4z" fill="currentColor"/><path d="M16 9.5l5 5M21 9.5l-5 5"/>', LINE),
    tune: icon('', '<path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.5"/><circle cx="8" cy="17" r="2.5"/>', LINE),
    up: icon('', '<path d="M6 14.5l6-6 6 6"/>', LINE),
    lock: icon('', '<rect x="5.5" y="10.5" width="13" height="9" rx="2.5"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/>', LINE),
    star: icon('star', STAR_PATH),
    chev: icon('chev', '<path d="M9 6l6 6-6 6"/>', LINE),
    back: icon('', '<path d="M15 6l-6 6 6 6"/>', LINE),
    edit: icon('', '<path d="M4 20h4L18.5 9.5a2.1 2.1 0 0 0-3-3L5 17v3z"/><path d="M13.5 8.5l3 3"/>', LINE),
    close: icon('', '<path d="M6 6l12 12M18 6L6 18"/>', LINE),
  };
  // The snow leopard: moods are switched with data-mood on the wrapper (idle, happy, wink, listen).
  const BARS = `<svg viewBox="0 0 120 120" aria-hidden="true">
    <circle cx="30" cy="34" r="17" fill="#dfe3e8"/><circle cx="90" cy="34" r="17" fill="#dfe3e8"/>
    <circle cx="30" cy="35" r="9" fill="#4a4f57"/><circle cx="90" cy="35" r="9" fill="#4a4f57"/>
    <ellipse cx="60" cy="68" rx="46" ry="42" fill="#f4f5f7" stroke="#d9dde2" stroke-width="1.5"/>
    <g fill="#555b63"><ellipse cx="47" cy="38" rx="4" ry="3" transform="rotate(-20 47 38)"/><ellipse cx="60" cy="34" rx="3.5" ry="3"/><ellipse cx="73" cy="38" rx="4" ry="3" transform="rotate(20 73 38)"/>
      <circle cx="24" cy="62" r="3"/><circle cx="96" cy="62" r="3"/><circle cx="22" cy="76" r="2.5"/><circle cx="98" cy="76" r="2.5"/><circle cx="31" cy="50" r="2.5"/><circle cx="89" cy="50" r="2.5"/></g>
    <ellipse cx="60" cy="86" rx="22" ry="16" fill="#fff"/>
    <g class="e-open l"><ellipse cx="42" cy="66" rx="5.5" ry="6.5" fill="#1d1d1f"/><circle cx="44" cy="63.5" r="1.8" fill="#fff"/></g>
    <g class="e-open r"><ellipse cx="78" cy="66" rx="5.5" ry="6.5" fill="#1d1d1f"/><circle cx="80" cy="63.5" r="1.8" fill="#fff"/></g>
    <g class="e-happy" fill="none" stroke="#1d1d1f" stroke-width="3.2" stroke-linecap="round"><path d="M36 68q6-8 12 0"/><path d="M72 68q6-8 12 0"/></g>
    <path class="e-wink" d="M72 67q6-6 12 0" fill="none" stroke="#1d1d1f" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M54 79h12l-6 7z" fill="#ff8f7a" stroke="#ff8f7a" stroke-width="2" stroke-linejoin="round"/>
    <g class="m-smile" fill="none" stroke="#3a3f45" stroke-width="2" stroke-linecap="round"><path d="M60 87v3"/><path d="M60 90q-5 5-10 1"/><path d="M60 90q5 5 10 1"/></g>
    <g class="m-open"><path d="M50 89q10 13 20 0z" fill="#3a3f45"/><path d="M55 94.5q5 4 10 0q-5-3-10 0z" fill="#ff8f7a"/></g>
    <g stroke="#c5cad1" stroke-width="1.5" stroke-linecap="round"><path d="M34 86l-12-3"/><path d="M34 91l-12 2"/><path d="M86 86l12-3"/><path d="M86 91l12 2"/></g>
  </svg>`;

  // ---------- text: words, syllables, hard sounds ----------
  const LETTER = "A-Za-zʻʼ‘’`'ʹ′´";
  const TOKEN_RE = new RegExp(`[${LETTER}]+|[^${LETTER}]+`, 'g'), WORD_RE = new RegExp(`^[${LETTER}]`);
  const MARK_RE = /[ʻ‘`']/; // the turned comma of oʻ and gʻ, however it was typed
  const HARD = new Set(['q', 'x', 'ch', 'sh', 'gʻ', 'oʻ']);

  // Letters as Uzbek counts them: sh, ch, oʻ and gʻ are one letter each.
  function units(word) {
    const out = [];
    for (let i = 0; i < word.length; i++) {
      const c = word[i], n = word[i + 1] || '', lc = c.toLowerCase();
      if ((lc === 'o' || lc === 'g') && MARK_RE.test(n)) { out.push(c + n); i++; }
      else if ((lc === 's' || lc === 'c') && n.toLowerCase() === 'h') { out.push(c + n); i++; }
      else out.push(c);
    }
    return out;
  }
  const isVowel = (u) => /^[aeiou]/i.test(u);
  // One vowel per syllable: V-V, V-CV, VC-CV, VCC-CV (soat -> so-at, gʻildirakni -> gʻil-di-rak-ni, toʻrtta -> toʻrt-ta).
  function syllables(word) {
    const u = units(word), v = [];
    u.forEach((x, i) => { if (isVowel(x)) v.push(i); });
    const out = [];
    let from = 0;
    for (let k = 0; k + 1 < v.length; k++) {
      const gap = v[k + 1] - v[k] - 1, cut = gap <= 1 ? v[k] + 1 : v[k + 1] - 1;
      out.push(u.slice(from, cut));
      from = cut;
    }
    out.push(u.slice(from));
    return out;
  }
  const unitHtml = (u) => (HARD.has(u.toLowerCase().replace(MARK_RE, 'ʻ')) ? `<b class="hs">${esc(u)}</b>` : esc(u));
  const wordHtml = (word, split) => (split ? syllables(word) : [units(word)]).map((s) => s.map(unitHtml).join('')).join('<i class="sy">-</i>');

  // Split a tongue twister into words (the same ones the server judges) and the gaps between them.
  function parse(text) {
    const parts = [];
    for (const s of text.match(TOKEN_RE) || []) {
      if (WORD_RE.test(s)) { parts.push({ word: true, text: s, tail: '' }); continue; }
      // Punctuation right after a word stays glued to it, so a line never starts with a comma.
      const glued = /^\S+/.exec(s), last = parts[parts.length - 1];
      if (glued && last && last.word) {
        last.tail = glued[0];
        if (s.length > glued[0].length) parts.push({ text: s.slice(glued[0].length) });
      } else parts.push({ text: s.replace(/^ (?=[—–])/, '\u00a0') }); // a dash never starts a line
    }
    return parts;
  }
  // Where each word ends in the sample, as a share of its length: longer words and pauses take more time.
  function timeline(parts) {
    const w = parts.filter((p) => p.word).map((p) => p.text.length + (/[.,!?;:]/.test(p.tail) ? 4 : 1));
    const total = w.reduce((a, b) => a + b, 0) || 1;
    let acc = 0;
    return w.map((x) => (acc += x) / total);
  }

  // ---------- audio helpers ----------
  function wavBlob(pcm, rate) {
    const buf = new ArrayBuffer(44 + pcm.length * 2), dv = new DataView(buf);
    const put = (o, s) => { for (let i = 0; i < 4; i++) dv.setUint8(o + i, s.charCodeAt(i)); };
    put(0, 'RIFF'); dv.setUint32(4, 36 + pcm.length * 2, true); put(8, 'WAVE'); put(12, 'fmt ');
    dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true); dv.setUint32(24, rate, true);
    dv.setUint32(28, rate * 2, true); dv.setUint16(32, 2, true); dv.setUint16(34, 16, true); put(36, 'data'); dv.setUint32(40, pcm.length * 2, true);
    new Int16Array(buf, 44).set(pcm);
    return new Blob([buf], { type: 'audio/wav' });
  }
  // Local preview only: a soft beep per word stands in for the narrator's recording.
  function mockVoice(text) {
    const n = words(text), rate = 16000, per = 0.42;
    const pcm = new Int16Array(Math.round((n * per + 0.3) * rate));
    for (let w = 0; w < n; w++) {
      const f = 300 + (w % 5) * 60, s0 = Math.round((0.15 + w * per) * rate), len = Math.round(0.3 * rate);
      for (let i = 0; i < len; i++) pcm[s0 + i] = Math.sin((2 * Math.PI * f * i) / rate) * Math.sin((Math.PI * i) / len) * 5000;
    }
    return URL.createObjectURL(wavBlob(pcm, rate));
  }

  // ---------- API ----------
  async function api(path, body, isForm) {
    if (mock) return mockApi(path, body);
    const headers = { 'x-telegram-init-data': tg.initData };
    if (!isForm) headers['content-type'] = 'application/json';
    const res = await fetch(`${API}/${path}`, { method: 'POST', headers, body: isForm ? body : JSON.stringify(body || {}) });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) { const e = new Error(data.error || `HTTP ${res.status}`); e.code = data.error || `http_${res.status}`; throw e; }
    return data;
  }

  // Local preview only (?mock=1 outside Telegram; ?mock=noaudio hides the narrator): no server.
  async function mockApi(path) {
    await new Promise((r) => setTimeout(r, 300));
    if (path === 'session') {
      const list = [[6, 2, 'Gʻani gʻildirakni gʻizillatib gʻildiratdi.'], [1, 1, 'Togʻdan tosh tushdi.'], [4, 1, 'Raʼno rasmlariga rang-barang rang tanladi.'],
        [10, 2, 'Oq choynakka koʻk qopqoq, koʻk choynakka oq qopqoq.'], [13, 3, 'Bahodir bayroqni Botirga berdimi, Botir Bahodirga bayroqni berdimi?'],
        [12, 3, 'Shokir shifokorlarning shart-sharoitini shoshilmasdan sharhladi.'], [3, 1, 'Qora-qura qoʻzilar qirda quvonib oʻtlar.'],
        [2, 1, 'Soat soatiga soatlab qaradi.'], [5, 1, 'Kitob kitobxonlarga kerak, kitobxonlarga kitob kerak.'],
        [7, 2, 'Chori chayilgan choynakka choyni chamalab soldi.'], [8, 2, 'Turgʻun toʻrtta toʻrgʻayni toʻrga tushirdi.'],
        [9, 2, 'Tovuq sovuqda sovqotadimi? Sovuqda tovuq sovqotadimi?'], [11, 3, 'Belbogʻini belga bogʻlab, bogʻbon bobo bogʻga bordi.'],
        [14, 3, 'Paxta qattiqmi, taxta qattiq? Sodiq momiq paxtani terdi.'], [15, 3, 'Besh mis barkash, besh mis barkashning ichida besh ming mis barkash.'],
        [16, 2, 'Oʻroq oʻxshar soʻroqqa, soʻroq oʻxshar oʻroqqa.'], [17, 2, 'Koʻm-koʻk kurtak, koʻkatlar koʻklamga koʻrk koʻrsatar.'],
        [18, 3, 'Uchuvchi suzuvchini uchratdimi, suzuvchi uchuvchini uchratdimi?'],
        [19, 3, 'Temur bilan Yoʻlchi — temiryoʻlchi, temiryoʻlchiga aytib koʻr-chi.'], [20, 2, 'Darsda Nasim rasm soldi, Nasim rasmga razm soldi.']];
      const audio = query.get('mock') !== 'noaudio';
      return { ok: true, isAdmin: query.get('as') !== 'child', sttReady: true, sttProvider: 'VoiceLab (Aisha)',
        twisters: list.map(([id, level, text]) => ({ id, level, text, audio: audio ? mockVoice(text) : null })) };
    }
    if (path === 'check') {
      const card = state.recCard, t = card.t;
      const toks = t.text.split(/[\s\-–—]+/).map((w) => w.replace(/[.,!?;:«»"()]/g, '')).filter(Boolean);
      const fail = card.attempt === 1 && (t.id === 6 || t.id === 10);
      const heard = t.id === 6 ? 'gildirakni' : 'shoynakka';
      if (state.lesson) MOCKT.results.push({ studentId: state.lesson.studentId, key: state.lesson.key, id: t.id, stars: fail ? 0 : t.id === 4 ? 2 : 3 });
      return { ok: true, status: 'Success', passed: !fail, confidence: 0.91, recognized: fail ? `${toks[0]} ${heard}` : t.text, extras: [],
        words: toks.map((d, i) => ({ d, t: d.toLowerCase(), h: fail && i === 1 ? heard : d.toLowerCase(),
          v: fail ? (i === 1 ? 'wrong' : i === toks.length - 1 ? 'missing' : 'ok') : (t.id === 4 && i === 2 ? 'near' : 'ok') })) };
    }
    return { ok: true };
  }

  // ---------- cards ----------
  const running = (card) => !card.done || card.again;
  const cardOf = (node) => { const el = node.closest('.card'); return state.cards.find((c) => c.el === el) || null; };
  const cur = () => state.cards.find((c) => c.el === state.activeEl) || null;
  const part = (card, r) => card.el.querySelector(`[data-r="${r}"]`);
  const totalStars = () => Object.values(state.progress.stars).reduce((a, b) => a + (Number(b) || 0), 0);
  const targetSeconds = (card) => Math.max(1.5, Math.round(words(card.t.text) * 0.6 * 10) / 10);
  const starHtml = (filled, anim, i) => `<svg class="${filled ? 'f' : ''}${anim ? ' a' : ''}" viewBox="0 0 24 24" aria-hidden="true"${anim ? ` style="animation-delay:${i * 130}ms"` : ''}>${STAR_PATH}</svg>`;
  // In a student's lesson (teacher mode) the device's own stars are not shown and the corner button leads back to the group.
  const metaHtml = (left) => `<div class="meta">${left}<span class="sp"></span>${state.lesson ? '' : `<span class="total">${ICON.star}<b data-total>0</b></span>`}`
    + `<button class="ico" type="button" data-act="sound" aria-label="Ovoz">${state.sound ? ICON.sound : ICON.mute}</button>`
    + (state.lesson ? `<button class="ico" type="button" data-act="toteach" aria-label="Guruhga qaytish">${ICON.close}</button>`
      : `<button class="ico admin-only" type="button" data-act="sheet" aria-label="Sozlamalar">${ICON.tune}</button>`) + '</div>';

  function makeCard(ti, n) {
    const t = state.twisters[ti], parts = parse(t.text);
    return { ti, n, t, parts, cum: timeline(parts), el: null, stage: 'sekin', reached: 0, attempt: 1, done: false, again: false, gaveUp: false,
      stars: 0, fresh: false, result: null, msg: null, hard: new Set(), hi: -1 };
  }

  function mount(card) {
    const el = document.createElement('section');
    el.className = 'card';
    el.innerHTML = `<div class="segs">${STAGES.map((s) => `<button class="seg" type="button" data-act="stage" data-stage="${s}" aria-label="${STAGE_LABEL[s]}"><i><b></b></i></button>`).join('')}</div>
      <div class="seglab" aria-hidden="true">${STAGES.map((s) => `<span>${STAGE_LABEL[s]}</span>`).join('')}</div>
      ${metaHtml('<span data-r="count"></span>')}
      <div class="box">
        <div class="body"><p class="cap" data-r="cap"></p><p class="tw" data-r="tw"></p></div>
        <div class="rail">
          <div class="bars sm" data-r="bars" data-mood="idle">${BARS}</div>
          <button class="rb" type="button" data-act="play" aria-label="Tinglash">${ICON.play}</button>
          <button class="rb" type="button" data-act="slow" aria-label="Sekin tinglash"><span aria-hidden="true">🐢</span></button>
        </div>
      </div>
      <div class="status"><div class="stars" data-r="stars"></div><p class="msg" data-r="msg" aria-live="polite"></p></div>
      <div class="act">
        <button class="pill primary" type="button" data-act="said" data-r="said">Aytdim</button>
        <div class="micbox" data-r="micbox">
          <svg class="ring" viewBox="0 0 128 128" aria-hidden="true"><circle class="trk" cx="64" cy="64" r="60"/><circle class="prg" data-r="prg" cx="64" cy="64" r="60"/></svg>
          <span class="halo" data-r="halo"></span>
          <button class="mic" type="button" data-act="mic" data-r="mic" aria-label="Gapirish">${ICON.mic}${ICON.stop}${ICON.dots}</button>
        </div>
        <button class="pill primary" type="button" data-act="next" data-r="next">Keyingisi</button>
      </div>
      <p class="foot" data-r="foot"></p>`;
    card.el = el;
    if (state.summaryEl) feed.insertBefore(el, state.summaryEl); else feed.appendChild(el);
    io.observe(el);
    paint(card);
    // Warm the cache so the sample starts at once when the card is swiped in.
    if (card.t.audio) { try { const a = new Audio(); a.preload = 'auto'; a.src = card.t.audio; state.pre = a; } catch (e) {} }
  }

  function twHtml(card) {
    const split = card.stage === 'sekin' && running(card) && !card.result;
    let wi = -1;
    return card.parts.map((p) => {
      if (!p.word) return esc(p.text);
      wi++;
      const r = card.result && card.result[wi];
      const heard = r && r.v === 'wrong' && r.h ? `<small>${esc(r.h)}</small>` : '';
      return `<span class="w${r ? ` ${r.v}` : ''}" data-i="${wi}">${wordHtml(p.text, split)}${p.tail ? `<u>${esc(p.tail)}</u>` : ''}${heard}</span>`;
    }).join('');
  }
  function sizeClass(card) {
    const len = card.t.text.length + (card.stage === 'sekin' && running(card) && !card.result ? 8 : 0);
    return len <= 22 ? 's1' : len <= 42 ? 's2' : len <= 62 ? 's3' : 's4';
  }
  function defaultMsg(card) {
    if (!running(card)) return card.gaveUp && !card.stars ? { kind: 'warn', text: 'Bu tez aytishga keyinroq qaytamiz.' } : { kind: 'ok', text: 'Barakalla!' };
    if (card.stage === 'tez') return { text: state.sttReady ? `Mikrofonni bos va ${fmt(targetSeconds(card))} soniyada ayt.` : 'Ovozli tekshiruv hali ulanmagan.' };
    return { text: card.t.audio ? 'Tingla va ovoz chiqarib takrorla.' : 'Ovoz chiqarib oʻqi.' };
  }

  function paint(card) {
    if (!card.el) return;
    const el = card.el, run = running(card), at = STAGES.indexOf(card.stage), last = card.n === state.cards.length - 1;
    el.querySelectorAll('.seg').forEach((s, i) => {
      const on = run && i === at;
      s.classList.toggle('done', !run || i < at);
      s.classList.toggle('on', on);
      if (!on) s.querySelector('b').style.width = '';
    });
    el.querySelectorAll('.seglab span').forEach((s, i) => { s.className = !run || i < at ? 'done' : i === at ? 'on' : ''; });
    part(card, 'count').textContent = `${state.mod ? `${state.mod.title} · ` : ''}${card.n + 1} / ${state.cards.length}`;
    part(card, 'cap').innerHTML = run ? `<b>${STAGE_LABEL[card.stage]}</b> · ${STAGE_CAP[card.stage]}` : `${card.t.level}-daraja`;
    const tw = part(card, 'tw');
    tw.className = `tw ${sizeClass(card)}${card.result ? ' res' : ''}`;
    tw.innerHTML = twHtml(card);
    card.hi = -1;
    el.querySelectorAll('[data-act="play"],[data-act="slow"]').forEach((b) => b.classList.toggle('hide', !card.t.audio));

    const stars = part(card, 'stars');
    stars.classList.toggle('hide', run);
    if (!run) stars.innerHTML = [1, 2, 3].map((i) => starHtml(i <= card.stars, card.fresh && i <= card.stars, i - 1)).join('');
    card.fresh = false;
    const m = card.msg || defaultMsg(card), msg = part(card, 'msg');
    msg.className = `msg ${m.kind || ''}`;
    msg.textContent = m.text;

    const tez = run && card.stage === 'tez';
    part(card, 'said').classList.toggle('hide', !run || tez);
    part(card, 'micbox').classList.toggle('hide', !tez);
    part(card, 'mic').disabled = !state.sttReady;
    const next = part(card, 'next');
    next.classList.toggle('hide', run);
    next.textContent = last ? 'Natijalar' : 'Keyingisi';

    const foot = part(card, 'foot');
    foot.className = run ? 'foot' : 'foot up';
    if (state.error && run) foot.innerHTML = '<button class="link" type="button" data-act="sheet">Texnik maʼlumot</button>';
    else foot.innerHTML = run ? `${ICON.lock}<span>Aytgach, yuqoriga sur</span>` : `${ICON.up}<span>${last ? 'Natijalar uchun yuqoriga sur' : 'Yuqoriga sur'}</span>`;
  }
  function paintTotals() {
    const n = String(totalStars());
    document.querySelectorAll('[data-total]').forEach((b) => { b.textContent = n; });
  }
  // A message for right now (recording, checking) that is not kept on the card.
  function setMsg(card, text, kind) {
    const msg = part(card, 'msg');
    msg.className = `msg ${kind || ''}`;
    msg.textContent = text;
  }
  function say(card, kind, text) { card.msg = { kind, text }; paint(card); }
  function mood(card, m, ms) {
    const b = part(card, 'bars');
    b.dataset.mood = m;
    clearTimeout(card.moodTimer);
    if (ms) card.moodTimer = setTimeout(() => { b.dataset.mood = 'idle'; }, ms);
  }

  // ---------- welcome and summary ----------
  function userName() {
    try { return String((tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.first_name) || '').trim().slice(0, 18); } catch (e) { return ''; }
  }
  function consentText() {
    const service = state.provider || 'nutqni aniqlash';
    const removed = /voicelab/i.test(state.provider) ? ' va tekshirilgach, u yerdan darhol oʻchiriladi' : '';
    return `Mashqda bolaning ovozi tekshirish uchun ${service} xizmatiga yuboriladi${removed}. Bizda ovoz yozuvi saqlanmaydi: faqat natija, yaʼni qaysi soʻz toʻgʻri aytilgani yoziladi.`;
  }
  function buildWelcome() {
    const el = document.createElement('section');
    el.className = 'card welcome';
    el.innerHTML = `${metaHtml('<span class="brand">Tez aytish</span>')}
      <div class="hero"><div class="bars xl" data-r="bars" data-mood="idle">${BARS}</div><h1 data-r="h1">Tez aytish</h1><p class="lead" data-r="lead">Yuklanmoqda…</p></div>
      <div class="act"><button class="pill primary hide" type="button" data-r="go" data-act="begin">Boshlash</button></div>
      <p class="foot"><button class="link" type="button" data-act="sheet">Texnik maʼlumot</button><button class="link hide" type="button" data-act="tmode" data-r="tmode">Oʻqituvchilar uchun</button></p>`;
    feed.appendChild(el);
    state.welcomeEl = el;
    state.activeEl = el;
    io.observe(el);
  }
  function welcome(kind, text) {
    const el = state.welcomeEl, q = (r) => el.querySelector(`[data-r="${r}"]`), go = q('go'), name = userName();
    const set = (h1, lead, btn, act, m) => {
      q('h1').textContent = h1;
      q('lead').textContent = lead;
      go.classList.toggle('hide', !btn);
      if (btn) { go.textContent = btn; go.dataset.act = act; }
      q('bars').dataset.mood = m || 'idle';
    };
    el.classList.toggle('consent', kind === 'consent');
    showTabs(kind === 'ready');
    if (kind === 'ready') {
      const plan = state.mod ? `«${state.mod.title}» moduli: ${state.cards.length} ta tez aytish.` : `Bugun ${state.cards.length} ta tez aytish.`;
      set(name ? `Salom, ${name}!` : 'Salom!', state.sttReady ? `${plan} Tingla, takrorla va tez ayt!`
        : 'Ovozli tekshiruv hali ulanmagan: mashq ishlaydi, lekin natija chiqmaydi.', 'Boshlash', 'begin');
    } else if (kind === 'consent') set('Ota-onalar uchun', consentText(), 'Roziman, boshlaymiz', 'consent');
    else if (kind === 'soon') set('Tez orada!', 'Tez aytish trenajyori hozircha tayyorlanmoqda. Tez orada ochiladi!', '', '', 'wink');
    else if (kind === 'error') set('Ulanib boʻlmadi', text, 'Qayta urinish', 'reload', 'wink');
    else set('Tez aytish', text || 'Yuklanmoqda…', '', '');
  }
  function mountSummary() {
    let el = state.summaryEl;
    if (!el) {
      el = document.createElement('section');
      el.className = 'card summary';
      feed.appendChild(el);
      state.summaryEl = el;
      io.observe(el);
    }
    const got = state.cards.reduce((a, c) => a + c.stars, 0);
    const hard = [...new Set(state.cards.flatMap((c) => [...c.hard]))].slice(0, 6);
    if (state.lesson) {
      el.innerHTML = `${metaHtml('<span class="brand">Dars tugadi</span>')}
        <div class="hero">
          <div class="bars lg" data-mood="${got ? 'happy' : 'wink'}">${BARS}</div>
          <h1>${esc(state.lesson.name)}</h1>
          <p class="lead">${state.cards.length} ta tez aytishda ${got} ta yulduz.</p>
          <ul class="sum">${state.cards.map((c) => `<li><span>${esc(c.t.text)}</span><span class="st">${[1, 2, 3].map((i) => starHtml(i <= c.stars)).join('')}</span></li>`).join('')}</ul>
          ${hard.length ? `<div class="hard"><p>Yana mashq qilish uchun soʻzlar</p>${hard.map((w) => `<span class="chip">${esc(w)}</span>`).join('')}</div>` : ''}
        </div>
        <div class="act"><button class="pill primary" type="button" data-act="toteach">Guruhga qaytish</button></div>
        <p class="foot"></p>`;
      return;
    }
    el.innerHTML = `${metaHtml('<span class="brand">Natijalar</span>')}
      <div class="hero">
        <div class="bars lg" data-mood="${got ? 'happy' : 'wink'}">${BARS}</div>
        <h1>${got ? 'Barakalla!' : 'Yaxshi urinish!'}</h1>
        <p class="lead">${state.cards.length} ta tez aytishda ${got} ta yulduz yigʻding.</p>
        <ul class="sum">${state.cards.map((c) => `<li><span>${esc(c.t.text)}</span><span class="st">${[1, 2, 3].map((i) => starHtml(i <= c.stars)).join('')}</span></li>`).join('')}</ul>
        ${hard.length ? `<div class="hard"><p>Yana mashq qilish uchun soʻzlar</p>${hard.map((w) => `<span class="chip">${esc(w)}</span>`).join('')}</div>` : ''}
      </div>
      <div class="act"><button class="pill primary" type="button" data-act="again">${state.mod ? 'Qayta boshlash' : `Yana ${Math.min(SESSION_SIZE, state.twisters.length)} ta`}</button><button class="pill small" type="button" data-act="tomods">Modullar</button></div>
      <p class="foot"></p>`;
    paintTotals();
  }

  // ---------- feed ----------
  const io = new IntersectionObserver((entries) => {
    for (const e of entries) if (e.isIntersecting && e.intersectionRatio >= 0.6) activate(e.target);
  }, { root: feed, threshold: [0.6] });

  function activate(el) {
    if (state.activeEl === el) return;
    state.activeEl = el;
    const card = state.cards.find((c) => c.el === el);
    if (card && state.voiceCard === card) return; // a tap already started this card's sample
    stopVoice();
    if (card && running(card)) autoplay(card);
  }
  function go(el, instant) { if (el) feed.scrollTo({ top: el.offsetTop, behavior: instant ? 'auto' : 'smooth' }); }
  function lockFeed(on) { feed.classList.toggle('lock', !!on); }

  // The day's session: the next few tongue twisters after the last one the child finished.
  function dailyList(start) {
    const n = state.twisters.length, from = (((Number(start) || 0) % n) + n) % n;
    return Array.from({ length: Math.min(SESSION_SIZE, n) }, (_, k) => (from + k) % n);
  }
  // A session is a list of tongue twisters (indexes into state.twisters): the day's five or a whole module. Only
  // the first card exists at the start: the next one is added when the current one is finished, which is what keeps
  // the swipe forward locked until the child has spoken.
  function newSession(list, mod) {
    stopVoice();
    clearTimeout(state.nextTimer);
    for (const c of state.cards) if (c.el) { io.unobserve(c.el); c.el.remove(); }
    if (state.summaryEl) { io.unobserve(state.summaryEl); state.summaryEl.remove(); state.summaryEl = null; }
    state.mod = mod || null;
    state.cards = list.map((ti, k) => makeCard(ti, k));
    mount(state.cards[0]);
    paintTotals();
  }

  function complete(card, stars, gaveUp) {
    const first = !card.done, p = state.progress, id = card.t.id;
    card.done = true; card.again = false; card.fresh = stars > 0;
    if (first) card.gaveUp = !!gaveUp; else if (stars) card.gaveUp = false;
    card.stars = Math.max(card.stars, stars);
    // A lesson on the teacher's phone belongs to the student (the server keeps it), not to this device's progress.
    if (!state.lesson) {
      if (stars) { p.stars[id] = Math.max(Number(p.stars[id]) || 0, stars); p.later = p.later.filter((x) => x !== id); }
      else if (!p.later.includes(id)) p.later.push(id);
      if (first && !state.mod) p.idx = (card.ti + 1) % state.twisters.length; // a module does not move the day's place
      store.set(PROGRESS_KEY, p);
    }
    const next = state.cards[card.n + 1];
    if (next && !next.el) mount(next);
    if (state.cards.every((c) => c.done)) mountSummary();
    paintTotals();
  }

  function begin() {
    const card = state.cards[0];
    if (!card) return;
    // Start the sample inside the tap: after that the player may also start from code when a card is swiped in.
    if (state.sound && card.t.audio && running(card)) playVoice(card, RATE[card.stage], true); else blessVoice();
    go(card.el);
  }
  function acceptConsent() {
    state.consent = true;
    store.set(CONSENT_KEY, true);
    newSession(dailyList(state.progress.idx));
    welcome('ready');
    begin();
    reportMic('opened');
  }
  function said(card) {
    const i = STAGES.indexOf(card.stage);
    if (!running(card) || i >= STAGES.length - 1) return;
    haptic('impact');
    card.stage = STAGES[i + 1]; card.reached = Math.max(card.reached, i + 1); card.msg = null;
    stopVoice();
    paint(card);
    autoplay(card);
  }
  // Tapping a segment goes back to a warm-up stage that was already opened.
  function jumpStage(card, stage) {
    const i = STAGES.indexOf(stage);
    if (!running(card) || card.again || i < 0 || i > card.reached || stage === card.stage) return;
    card.stage = stage; card.result = null; card.msg = null;
    stopVoice();
    paint(card);
    autoplay(card);
  }
  function goNext(card) {
    const next = state.cards[card.n + 1];
    go(next && next.el ? next.el : state.summaryEl);
  }
  // After its one check a card moves on by itself, once the child has had a moment to see the result. Nothing
  // happens if the child has already swiped away, opened the modules or started something else.
  function autoNext(card) {
    clearTimeout(state.nextTimer);
    state.nextTimer = setTimeout(() => {
      if (state.view === 'reels' && state.activeEl === card.el && !state.recording && !state.busy) goNext(card);
    }, AUTO_NEXT_MS);
  }
  function restart() {
    if (state.mod) newSession(state.mod.list, state.mod); else newSession(dailyList(state.progress.idx));
    welcome('ready');
    const card = state.cards[0];
    go(card.el, true);
    if (state.sound && card.t.audio) playVoice(card, RATE[card.stage], true);
  }
  // ---------- tabs and modules ----------
  function showTabs(on) {
    document.body.classList.toggle('tabs-on', !!on);
    $('tabs').classList.toggle('hide', !on);
    if (!on) { state.view = 'reels'; feed.classList.remove('away'); $('mods').classList.add('hide'); }
  }
  function setView(view) {
    if (state.recording || state.busy) return;
    const mods = view === 'mods';
    state.view = mods ? 'mods' : 'reels';
    $('tabReels').classList.toggle('on', !mods);
    $('tabReels').setAttribute('aria-selected', String(!mods));
    $('tabMods').classList.toggle('on', mods);
    $('tabMods').setAttribute('aria-selected', String(mods));
    feed.classList.toggle('away', mods);
    $('mods').classList.toggle('hide', !mods);
    if (mods) { stopVoice(); $('confirm').classList.add('hide'); renderModules(); }
  }
  function modulesNow() {
    const at = new Map(state.twisters.map((t, i) => [t.id, i])), used = new Set(), out = [];
    for (const m of MODULES) {
      const list = m.ids.filter((id) => at.has(id)).map((id) => at.get(id));
      list.forEach((i) => used.add(i));
      if (list.length) out.push({ ...m, list });
    }
    const rest = state.twisters.map((_, i) => i).filter((i) => !used.has(i));
    if (rest.length) out.push({ id: 'other', title: 'Boshqalar', badge: '+', list: rest });
    return out;
  }
  // Progress of a list of tongue twisters: how many have at least one star, and the stars in all.
  function stat(list) {
    let passed = 0, stars = 0;
    for (const i of list) { const s = Number(state.progress.stars[state.twisters[i].id]) || 0; stars += s; if (s > 0) passed++; }
    return { passed, stars, pct: list.length ? Math.round((passed * 100) / list.length) : 0 };
  }
  // Search ignores case and the turned comma, so «gani» finds «Gʻani».
  const fold = (s) => String(s).toLowerCase().replace(/[ʻʼ‘’`'´]/g, '').replace(/\s+/g, ' ').trim();
  function renderModules() {
    const all = stat(state.twisters.map((_, i) => i));
    $('allBar').querySelector('i').style.width = `${all.pct}%`;
    $('allBar').querySelector('span').textContent = `${all.pct}%`;
    const q = fold($('q').value), mods = modulesNow(), box = $('modList');
    if (!q) {
      box.innerHTML = '<p class="sect">Tovushlar</p>' + mods.map((m) => {
        const s = stat(m.list);
        return `<button class="mod${s.pct === 100 ? ' full' : ''}" type="button" data-mod="${esc(m.id)}"><span class="badge">${esc(m.badge)}</span>`
          + `<span class="mod-body"><span class="mt">${esc(m.title)}${m.week ? ` <small class="wk">${esc(m.week)}</small>` : ''}</span><span class="ms">${m.list.length} ta tez aytish · ${ICON.star}${s.stars}</span>`
          + `<span class="mbar"><b><i style="width:${s.pct}%"></i></b><span>${s.pct}%</span></span></span>${ICON.chev}</button>`;
      }).join('');
      return;
    }
    const hits = [];
    for (const m of mods) for (const i of m.list) if (fold(state.twisters[i].text).includes(q)) hits.push({ m, i });
    box.innerHTML = `<p class="sect">Topildi: ${hits.length}</p>` + (hits.length ? hits.map(({ m, i }) => {
      const got = Number(state.progress.stars[state.twisters[i].id]) || 0;
      return `<button class="hit" type="button" data-mod="${esc(m.id)}" data-tw="${i}"><span class="hit-t">${esc(state.twisters[i].text)}</span>`
        + `<span class="hit-m">${esc(m.title)}</span><span class="st">${[1, 2, 3].map((k) => starHtml(k <= got)).join('')}</span></button>`;
    }).join('') : '<p class="empty">Hech narsa topilmadi. Boshqa soʻz bilan qidirib koʻr.</p>');
  }
  // Open a module in the Reels tab, from its first tongue twister or from the one picked in the search.
  function openModule(id, from) {
    const m = modulesNow().find((x) => x.id === id);
    if (!m || state.recording || state.busy) return;
    const at = Math.max(0, m.list.indexOf(Number(from)));
    newSession(m.list.slice(at).concat(m.list.slice(0, at)), m);
    welcome('ready');
    setView('reels');
    begin();
  }
  function resetProgress() {
    state.progress = { idx: 0, stars: {}, later: [] };
    store.set(PROGRESS_KEY, state.progress);
    newSession(dailyList(0));
    welcome('ready');
    paintTotals();
    renderModules();
  }
  function toggleSound() {
    state.sound = !state.sound;
    store.set(SOUND_KEY, state.sound);
    document.querySelectorAll('[data-act="sound"]').forEach((b) => { b.innerHTML = state.sound ? ICON.sound : ICON.mute; b.setAttribute('aria-pressed', String(!state.sound)); });
    if (state.sound) sfx('tap'); else stopVoice();
  }
  function nudge(card) {
    const foot = part(card, 'foot');
    foot.classList.remove('shake');
    void foot.offsetWidth;
    foot.classList.add('shake');
    haptic('light');
  }

  // ---------- narrator sample ----------

  // ---------- teacher mode ----------

  const DAYS = ['Dushanba', 'Seshanba', 'Chorshanba', 'Payshanba', 'Juma', 'Shanba', 'Yakshanba'];

  const T_ERR = {
    name_required: 'Guruh nomini yozing.', days_required: 'Kamida bitta dars kunini tanlang.', first_name_required: 'Oʻquvchining ismini yozing.',
    bad_age: 'Yosh 3 dan 18 gacha boʻlsin.', not_a_teacher: 'Siz hali oʻqituvchi emassiz.', owner_only: 'Buni faqat egasi qila oladi.',
    group_not_found: 'Guruh topilmadi.', student_not_found: 'Oʻquvchi topilmadi.', past_week: 'Oʻtgan hafta uchun modul tanlab boʻlmaydi.',

  const myId = () => { try { return Number(tg.initDataUnsafe.user.id) || 0; } catch (e) { return 0; } };

  async function tapi(action, body) {
    if (mock) return mockTeacher(action, body || {});

    const data = await res.json().catch(() => ({}));
    if (!res.ok) { const e = new Error(data.error || `HTTP ${res.status}`); e.code = data.error || `http_${res.status}`; throw e; }
    return data;
  }
  const tErr = (e) => T_ERR[e.code] || `Xato: ${e.message}`;

  const sname = (s) => `${s.firstName}${s.lastName ? ` ${s.lastName}` : ''}`;

  const finished = (g, s) => g.lesson.status === 'open' && s.done.length >= g.lesson.ids.length;
  const topHtml = (title, back, right) => `<div class="t-top">${back ? `<button class="t-back" type="button" data-t="${back}" aria-label="Orqaga">${ICON.back}</button>` : ''}<h1 class="t-title">${esc(title)}</h1>${right || ''}</div>`;
  const msgHtml = () => (teach.msg ? `<p class="t-msg">${esc(teach.msg)}</p>` : '');

  async function loadTeach() {

  // Run a change, reload the teacher's data and go on; a refusal stays on the screen as a message.

  // A student's lesson runs in the Reels feed: the lesson's cards the student has not done yet, then back to the group.
  function startLesson(groupId, studentId) {
    const g = groupById(groupId), s = g && g.students.find((x) => x.id === studentId);
    if (!g || !s || g.lesson.status !== 'open') return;
    if (!s.consent) { teach.msg = 'Avval ota-ona roziligini belgilang.'; return renderTeach(); }
    const doneIds = new Set(s.done.map((d) => d.id)), at = new Map(state.twisters.map((t, i) => [t.id, i]));
    const list = g.lesson.ids.filter((id) => !doneIds.has(id) && at.has(id)).map((id) => at.get(id));
    if (!list.length) { teach.msg = 'Bu oʻquvchi darsni tugatgan.'; return renderTeach(); }
    state.lesson = { groupId, studentId, key: g.lesson.key, name: sname(s) };
    state.sttReady = !!teach.data.sttReady;
    newSession(list, { id: 'lesson', title: sname(s) });
    showTeach(false);
    state.welcomeEl.classList.add('hide');
    begin();

  function clearFeed() {

    clearTimeout(state.nextTimer);
    for (const c of state.cards) if (c.el) { io.unobserve(c.el); c.el.remove(); }
    if (state.summaryEl) { io.unobserve(state.summaryEl); state.summaryEl.remove(); state.summaryEl = null; }
    state.cards = []; state.mod = null;
  }
  async function enterTeach() {
    if (state.recording || state.busy) return;
    const back = state.lesson ? 'group' : 'home';
    clearFeed();
    state.lesson = null;
    state.welcomeEl.classList.add('hide');
    showTeach(true);
    teach.report = null;
    openView(back);
    try { await loadTeach(); renderTeach(); } catch (e) { teach.msg = tErr(e); renderTeach(); }
  }
  function enterPractice() {
    showTeach(false);
    state.welcomeEl.classList.remove('hide');
    state.sttReady = state.sessionStt;
    if (!state.cards.length) newSession(dailyList(state.progress.idx));
    welcome('ready');
    go(state.welcomeEl, true);
  }
  // The welcome card's last link: «Oʻqituvchilar uchun» asks to become a teacher, «Oʻqituvchi rejimi» goes back to it.
  function setTeachLink() {
    const b = state.welcomeEl && state.welcomeEl.querySelector('[data-r="tmode"]');
    if (!b) return;
    b.textContent = teach.role === 'owner' || teach.role === 'teacher' ? 'Oʻqituvchi rejimi' : 'Oʻqituvchilar uchun';
    b.classList.toggle('hide', !inTelegram && !mock);
  }
  async function teachRequest() {
    if (teach.role === 'owner' || teach.role === 'teacher') return enterTeach();
    try {
      const r = await tapi('request');
      welcome('info', r.status === 'removed' ? 'Oʻqituvchi huquqingiz oʻchirilgan. Egasiga murojaat qiling.'
        : r.status === 'active' ? 'Siz oʻqituvchisiz: Mini Appʼni yopib, qayta oching.'
          : 'Soʻrov yuborildi. Egasi tasdiqlagach, Mini Appʼni qayta oching: oʻqituvchi rejimi ochiladi.');
    } catch (e) { welcome('info', tErr(e)); }
  }

  // Local preview only: an in-memory teacher back end (?mock=1&role=owner|teacher|none).
  const MOCKT = { role: query.get('role') || 'owner', teachers: [{ telegramId: 77, name: 'Feruza', username: 'feruza', status: 'pending' }], groups: [], results: [], early: [], weeks: {} };
  const tday = (ms) => new Date(ms + 5 * 3600e3).toISOString().slice(0, 10);
  const addD = (key, n) => { const d = new Date(`${key}T00:00:00Z`); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
  const wdOf = (key) => new Date(`${key}T00:00:00Z`).getUTCDay() || 7;
  const wsOf = (key) => addD(key, 1 - wdOf(key));
  if (mock && MOCKT.role !== 'none') {
    const today = tday(Date.now());
    MOCKT.groups.push({ id: 'g1', name: 'Shanba guruhi', days: [wdOf(today)], created: addD(today, -30), students: [
      { id: 's1', firstName: 'Ali', lastName: 'Valiyev', age: 9, parentPhone: '+998901234567', consent: true, active: true },
      { id: 's2', firstName: 'Madina', lastName: '', age: 8, parentPhone: null, consent: false, active: true }] });
    MOCKT.weeks[`g1|${wsOf(today)}`] = 'g';
  }
  function mockFail(code) { const e = new Error(code); e.code = code; throw e; }
  function mockLesson(g, today) {
    const after = (from) => { for (let i = 1; i <= 7; i++) { const k = addD(from, i); if (g.days.includes(wdOf(k))) return k; } return null; };
    let key = null;
    for (let i = 0; i < 7 && !key; i++) { const k = addD(today, -i); if (g.days.includes(wdOf(k))) key = k; }
    let next = after(today), early = false;
    if (next && MOCKT.early.includes(`${g.id}|${next}`)) { key = next; next = after(key); early = true; }
    if (key && !early && key < g.created) key = null;
    const mid = key ? MOCKT.weeks[`${g.id}|${wsOf(key)}`] : null, m = MODULES.find((x) => x.id === mid);
    return { key, early, status: !key ? 'none' : m ? 'open' : 'no_module', moduleId: m ? mid : null, ids: m ? m.ids.slice(0, 4) : [], homework: m ? m.ids.slice(4) : [],
      next, nextOpensAt: null, nextModuleId: next ? MOCKT.weeks[`${g.id}|${wsOf(next)}`] || null : null };
  }
  function mockTeacher(action, b) {
    return new Promise((resolve, reject) => setTimeout(() => { try { resolve(mockTeacherNow(action, b)); } catch (e) { reject(e); } }, 120));
  }
  function mockTeacherNow(action, b) {
    const today = tday(Date.now()), staff = MOCKT.role !== 'none', ws = wsOf(today);
    const findG = (id) => { const g = MOCKT.groups.find((x) => x.id === id && !x.archived); if (!g) mockFail('group_not_found'); return g; };
    const result = (s, key, id) => MOCKT.results.find((r) => r.studentId === s.id && r.key === key && r.id === id);
    if (action === 'state') {
      const base = { ok: true, role: MOCKT.role, status: staff ? 'active' : null, name: 'Mock', sttReady: true, today, classSize: 4, modules: MODULES.map((m) => ({ id: m.id, title: m.title, badge: m.badge, ids: m.ids })) };
      if (!staff) return base;
      return { ...base, teachers: MOCKT.role === 'owner' ? MOCKT.teachers : null, groups: MOCKT.groups.filter((g) => !g.archived).map((g) => {
        const l = mockLesson(g, today);
        return { id: g.id, name: g.name, days: g.days, teacherId: 1, teacherName: null, mine: true, lesson: l,
          weeks: { thisStart: ws, thisModule: MOCKT.weeks[`${g.id}|${ws}`] || null, nextStart: addD(ws, 7), nextModule: MOCKT.weeks[`${g.id}|${addD(ws, 7)}`] || null },
          students: g.students.filter((s) => s.active).map((s) => ({ ...s, done: l.key ? l.ids.filter((id) => result(s, l.key, id)).map((id) => ({ id, stars: result(s, l.key, id).stars })) : [] })) };
      }) };
    }
    if (action === 'request') return { ok: true, status: 'pending' };
    if (!staff) mockFail('not_a_teacher');
    if (action === 'teacher') { const t = MOCKT.teachers.find((x) => x.telegramId === b.telegramId); if (!t) mockFail('teacher_not_found'); t.status = b.status; return { ok: true }; }
    if (action === 'group') {
      if (b.id && b.archive) { findG(b.id).archived = true; return { ok: true, id: b.id, archived: true }; }
      const name = String(b.name || '').trim(), days = [...new Set((b.days || []).map(Number).filter((d) => d >= 1 && d <= 7))].sort();
      if (!name) mockFail('name_required');
      if (!days.length) mockFail('days_required');
      if (b.id) { const g = findG(b.id); Object.assign(g, { name, days }); return { ok: true, id: g.id }; }
      const g = { id: `g${Date.now()}`, name, days, created: today, students: [] };
      MOCKT.groups.push(g);
      return { ok: true, id: g.id };
    }
    if (action === 'week') { findG(b.groupId); if (b.moduleId) MOCKT.weeks[`${b.groupId}|${b.weekStart}`] = b.moduleId; else delete MOCKT.weeks[`${b.groupId}|${b.weekStart}`]; return { ok: true }; }
    if (action === 'open') { const l = mockLesson(findG(b.groupId), today); if (!l.next) mockFail('days_required'); MOCKT.early.push(`${b.groupId}|${l.next}`); return { ok: true, lessonDate: l.next }; }
    if (action === 'student') {
      const all = MOCKT.groups.flatMap((g) => g.students);
      if (b.id && b.remove) { all.find((s) => s.id === b.id).active = false; return { ok: true, id: b.id, removed: true }; }
      const firstName = String(b.firstName || '').trim();
      if (!firstName) mockFail('first_name_required');
      if (b.age !== null && b.age !== undefined && (b.age < 3 || b.age > 18)) mockFail('bad_age');
      const g = findG(b.groupId);
      const row = { firstName, lastName: String(b.lastName || '').trim(), age: b.age || null, parentPhone: String(b.parentPhone || '').replace(/[^\d+]/g, '') || null, consent: b.consent === true };
      if (b.id) { const s = all.find((x) => x.id === b.id); MOCKT.groups.forEach((x) => { x.students = x.students.filter((y) => y !== s); }); Object.assign(s, row); g.students.push(s); return { ok: true, id: s.id }; }
      const s = { id: `s${Date.now()}`, active: true, ...row };
      g.students.push(s);
      return { ok: true, id: s.id };
    }
    if (action === 'report') {
      const g = findG(b.groupId), weeks = Array.from({ length: 6 }, (_, i) => addD(ws, -7 * (5 - i)));
      const rs = MOCKT.results.filter((r) => g.students.some((s) => s.id === r.studentId));
      return { ok: true, groupId: g.id, today, current: mockLesson(g, today).key, weeks,
        students: g.students.filter((s) => s.active).map((s) => {
          const mine = rs.filter((r) => r.studentId === s.id);
          return { id: s.id, missed: { count: 0, dates: [] }, sounds: mine.some((r) => r.stars === 0) ? [{ s: 'gʻ', n: 2 }] : [],
            weeks: weeks.map((w) => { const inW = mine.filter((r) => wsOf(r.key) === w); return { start: w, stars: inW.reduce((a, r) => a + r.stars, 0), max: w === ws ? 12 : 0, lessons: w === ws ? 1 : 0, done: new Set(inW.map((r) => r.key)).size }; }) };
        }),
        summary: { weekStart: ws, lessons: [...new Set(rs.map((r) => r.key))].map((k) => ({ key: k, finished: 0, started: 1, students: g.students.length })),
          avgStars: rs.length ? Math.round((rs.reduce((a, r) => a + r.stars, 0) / rs.length) * 10) / 10 : null, hardest: [] } };
    }
    return mockFail('not_found');
  }

  // ---------- start ----------
  async function init() {
    buildWelcome();
    paintTotals();
    renderDiag();
    if (!inTelegram && !mock) return welcome('info', 'Bu trenajyor Telegram ichida ishlaydi. Uni botdagi tugma orqali och.');
    try {
      // Who is asking in teacher mode comes from tez-aytish-teacher; if that fails, the page works as before.
      const [s, t] = await Promise.all([api('session'), tapi('state').catch((e) => { state.teachError = e.message; return null; })]);
      state.isAdmin = !!s.isAdmin; state.sttReady = !!(s.sttReady ?? s.speechReady); state.provider = s.sttProvider || '';
      state.sessionStt = state.sttReady;
      state.twisters = Array.isArray(s.twisters) ? s.twisters : [];
      if (t) { teach.data = t; teach.role = t.role || 'none'; }
      state.server = 'ok';
    } catch (e) {
      state.server = `xato: ${e.message}`;
      renderDiag();
      return welcome('error', e.code === 'invalid_or_expired_init_data' ? 'Sessiya eskirdi: Mini Appʼni yopib, qayta och.' : `Serverga ulanib boʻlmadi (${e.message}). Internetni tekshirib, qayta urinib koʻr.`);
    }
    document.body.classList.toggle('is-admin', state.isAdmin);
    $('note').textContent = state.isAdmin ? 'Admin rejimi: yozuvlar sozlash uchun saqlanadi.' : 'Ovoz yozuvi saqlanmaydi, faqat natija yoziladi.';
    setTeachLink();
    // A teacher (or the owner) starts in teacher mode: groups, students and the lessons.
    if (teach.role === 'owner' || teach.role === 'teacher') {
      if (!state.twisters.length) return welcome('info', 'Tez aytishlar roʻyxati boʻsh.');
      if (state.isAdmin) fillPicker();
      state.welcomeEl.classList.add('hide');
      showTeach(true);
      openView('home');
      renderDiag();
      return;
    }
    // While the trainer is closed for children they get a friendly 'coming soon' instead of a mic that cannot check.
    if (!state.sttReady && !state.isAdmin) return welcome('soon');
    if (!state.twisters.length) return welcome('info', 'Tez aytishlar roʻyxati boʻsh.');
    if (state.isAdmin) fillPicker();
    if (!state.isAdmin && !state.consent) return welcome('consent');
    newSession(dailyList(state.progress.idx));
    welcome('ready');
    reportMic('opened');
    renderDiag();
  }

  // ---------- events ----------
  feed.addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    ensureContext(); // sounds need a context that was started inside a tap
    const act = b.dataset.act, card = cardOf(b);
    if (act === 'sound') return toggleSound();
    if (act === 'sheet') return openSheet();
    if (state.recording) { if (act === 'mic') stop('manual'); return; }
    if (state.busy) return;
    if (act === 'tmode') return teachRequest();
    if (act === 'toteach') return enterTeach();
    if (act === 'begin') return begin();
    if (act === 'consent') return acceptConsent();
    if (act === 'reload') return location.reload();
    if (act === 'again') return restart();
    if (act === 'tomods') return setView('mods');
    if (!card) return;
    if (act === 'play') return manualPlay(card, RATE[card.stage]);
    if (act === 'slow') return manualPlay(card, SLOW_RATE);
    if (act === 'stage') return jumpStage(card, b.dataset.stage);
    if (act === 'said') return said(card);
    if (act === 'mic') return start(card);
    if (act === 'next') { clearTimeout(state.nextTimer); return goNext(card); }
  });
  // A swipe up on a card that is not finished yet cannot go anywhere: nudge the hint instead.
  let touchY = null;
  feed.addEventListener('touchstart', (e) => { touchY = e.touches[0].clientY; }, { passive: true });
  feed.addEventListener('touchend', (e) => {
    if (touchY === null) return;
    const dy = e.changedTouches[0].clientY - touchY;
    touchY = null;
    const card = cur();
    if (dy > -60 || !card || card.done || state.recording || state.busy) return;
    if (feed.scrollTop + feed.clientHeight >= feed.scrollHeight - 2) nudge(card);
  }, { passive: true });
  // Teacher mode: taps, the forms and the module of a week.
  $('teach').addEventListener('click', (e) => {
    const b = e.target.closest('[data-t]');
    if (!b || b.disabled || teach.busy) return;
    ensureContext();
    const a = b.dataset.t, id = b.dataset.id;
    if (a === 'home') return openView('home');
    if (a === 'group') return openView('group', { groupId: id || teach.groupId });
    if (a === 'student') { openView('student', { studentId: id || teach.studentId }); return ensureReport(); }
    if (a === 'report') { openView('report'); return ensureReport(true); }
    if (a === 'gnew') return openView('gform', { form: {} });
    if (a === 'gedit') return openView('gform', { form: { id: teach.groupId } });
    if (a === 'snew') return openView('sform', { form: {} });
    if (a === 'sedit') return openView('sform', { form: { id: teach.studentId } });
    if (a === 'garchive') return armed(b, () => teachAct(() => tapi('group', { id: teach.form.id, archive: true }), () => openView('home')));
    if (a === 'sremove') return armed(b, () => teachAct(() => tapi('student', { id: teach.form.id, remove: true }), () => openView('group')));
    if (a === 'opennow') return armed(b, () => teachAct(() => tapi('open', { groupId: teach.groupId })));
    if (a === 'tapprove' || a === 'treject' || a === 'tremove') return teachAct(() => tapi('teacher', { telegramId: Number(id), status: a === 'tapprove' ? 'active' : 'removed' }));
    if (a === 'lesson') return startLesson(teach.groupId, id);
    if (a === 'practice') return enterPractice();
    if (a === 'sheet') return openSheet();
  });
  $('teach').addEventListener('change', (e) => {
    const sel = e.target.closest('select[data-week]');
    if (sel) teachAct(() => tapi('week', { groupId: teach.groupId, weekStart: sel.dataset.week, moduleId: sel.value || null }));
  });
  $('teach').addEventListener('submit', (e) => {
    e.preventDefault();
    const f = e.target, fd = new FormData(f), editing = teach.form && teach.form.id;
    if (f.dataset.form === 'group') {
      const body = { name: String(fd.get('name') || ''), days: fd.getAll('day').map(Number) };
      if (editing) body.id = teach.form.id;
      if (fd.get('teacher')) body.teacherId = Number(fd.get('teacher'));
      return teachAct(() => tapi('group', body), (r) => openView('group', { groupId: r.id }));
    }
    if (f.dataset.form === 'student') {
      const age = String(fd.get('age') || '').trim();
      const body = { firstName: String(fd.get('firstName') || ''), lastName: String(fd.get('lastName') || ''), age: age ? Number(age) : null,
        parentPhone: String(fd.get('parentPhone') || ''), consent: fd.get('consent') === 'on', groupId: String(fd.get('groupId') || teach.groupId) };
      if (editing) body.id = teach.form.id;
      return teachAct(() => tapi('student', body), (r) => openView(editing ? 'student' : 'group', { groupId: body.groupId, studentId: r.id }));
    }
  });
  $('tabReels').addEventListener('click', () => setView('reels'));
  $('tabMods').addEventListener('click', () => setView('mods'));
  $('modList').addEventListener('click', (e) => {
    const b = e.target.closest('[data-mod]');
    if (!b) return;
    ensureContext(); // sounds and the sample need a tap to start
    openModule(b.dataset.mod, b.dataset.tw);
  });
  $('q').addEventListener('input', () => renderModules());
  $('reset').addEventListener('click', () => $('confirm').classList.toggle('hide'));
  $('resetNo').addEventListener('click', () => $('confirm').classList.add('hide'));
  $('resetYes').addEventListener('click', () => { $('confirm').classList.add('hide'); resetProgress(); });
  $('sheetWrap').addEventListener('click', (e) => { if (e.target === $('sheetWrap')) closeSheet(); });
  $('sheetClose').addEventListener('click', closeSheet);
  $('pick').addEventListener('change', (e) => {
    if (state.recording || state.busy) return;
    newSession(dailyList(Number(e.target.value) || 0));
    welcome('ready');
    closeSheet();
    setView('reels');
    go(state.cards[0].el);
  });
  $('copy').addEventListener('click', async () => {
    const text = $('diag').textContent;
    let ok = false;
    try { await navigator.clipboard.writeText(text); ok = true; } catch (e) {
      const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select(); try { ok = document.execCommand('copy'); } catch (e2) {} ta.remove();
    }
    $('copy').textContent = ok ? 'Nusxa olindi ✓' : 'Nusxa olinmadi';
    setTimeout(() => { $('copy').textContent = 'Nusxa olish'; }, 2500);
  });
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) return;
    stopVoice();
    if (state.recording) stop('hidden'); else releaseMic();
  });

  $('voice').addEventListener('timeupdate', () => { if (state.vdraw) state.vdraw(); });
  $('voice').addEventListener('ended', () => { if (state.voiceCard) stopVoice(true); });

  if (mock) window.__tez = { state, toWav16k, vad, syllables, parse, modulesNow, setView, teach, MOCKT, startLesson, enterTeach }; // local preview tests only
  init();
})();
</script>
</body>
