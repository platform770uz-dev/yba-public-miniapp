<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#ffffff">
<title>Tez aytish — trenajyor</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#fff;--surface:#f5f5f7;--ink:#1d1d1f;--sub:#6e6e73;--faint:#b0b0b6;--line:#e5e5ea;--accent:#ff5a3c;--accent-press:#e8492c;--accent-tint:#ffebe6;--ok:#1e8e3e;--warn:#8a5a00;--warn-tint:#fff1cc;--warn-line:#f0b429;--star:#f5a623;--ease:cubic-bezier(.2,.8,.2,1);--tabs-h:62px}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);overscroll-behavior:none}
body{color:var(--ink);font-family:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.4;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;border:0;background:none;padding:0}
button:focus-visible{outline:3px solid #0a84ff;outline-offset:3px}
button:disabled{opacity:.45;cursor:default}
h1,h2,p,ul{margin:0}
.hide{display:none!important}
.i{display:block;width:22px;height:22px}

/* The feed: one full-screen card per tongue twister, swiped vertically like Reels. */
.feed{position:fixed;top:0;right:0;bottom:0;left:0;overflow-y:auto;overflow-x:hidden;scroll-snap-type:y mandatory;overscroll-behavior:none;scrollbar-width:none}
.feed::-webkit-scrollbar{display:none}
.feed.lock{overflow:hidden}
.feed.away{visibility:hidden}
body.tabs-on .feed{top:calc(var(--tabs-h) + env(safe-area-inset-top))}
body.tabs-on .card{padding-top:8px}
.card{position:relative;height:100%;width:min(100%,480px);margin:0 auto;scroll-snap-align:start;scroll-snap-stop:always;display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top)) 20px calc(12px + env(safe-area-inset-bottom))}

/* Stage segments on top, like Stories. */
.segs{display:flex;gap:5px}
.seg{flex:1;height:22px;display:flex;align-items:center}
.seg i{display:block;width:100%;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.seg b{display:block;height:100%;width:0;border-radius:2px;background:var(--accent)}
.seg.on i{background:var(--accent-tint)}
.seg.done b{width:100%}
.seglab{display:flex;gap:5px;margin-top:-3px}
.seglab span{flex:1;font-size:12px;font-weight:700;color:var(--faint)}
.seglab span.on{color:var(--accent)}
.seglab span.done{color:var(--sub)}
.meta{display:flex;align-items:center;gap:4px;margin-top:6px;min-height:40px;font-size:14px;font-weight:700;color:var(--sub);font-variant-numeric:tabular-nums}
.meta .sp{flex:1}
.brand{font-size:16px;font-weight:800;color:var(--ink)}
.total{display:inline-flex;align-items:center;gap:4px;color:var(--ink);margin-right:4px}
.total .i{width:17px;height:17px}
.star path{fill:var(--star);stroke:var(--star);stroke-width:1.6;stroke-linejoin:round}
.ico{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink)}
.ico:active{background:var(--surface)}
.admin-only{display:none}
.is-admin .admin-only{display:grid}

/* Text and the side rail. */
.box{flex:1;min-height:0;display:flex;align-items:center;gap:12px}
.body{flex:1;min-width:0}
.cap{margin-bottom:10px;font-size:14px;font-weight:600;color:var(--sub)}
.cap b{color:var(--accent);font-weight:800}
.tw{font-weight:800;letter-spacing:-.02em;line-height:1.3;font-size:34px}
.tw.s1{font-size:42px}.tw.s2{font-size:34px}.tw.s3{font-size:29px}.tw.s4{font-size:25px}
.w{display:inline-block;max-width:100%;overflow-wrap:anywhere;vertical-align:top;border-bottom:3px solid transparent;border-radius:8px;transition:background-color .15s,box-shadow .15s,color .2s}
.w u{text-decoration:none}
.hs{font-weight:inherit;color:var(--accent)}
.sy{font-style:normal;font-weight:500;color:var(--faint);margin:0 .03em}
.w.on{background:var(--accent-tint);box-shadow:0 0 0 4px var(--accent-tint)}
.tw.res .hs{color:inherit}
.w.ok,.w.near{color:var(--ok)}
.w.near{border-bottom:3px dotted var(--warn-line);border-radius:0}
.w.wrong{color:var(--warn);background:var(--warn-tint);box-shadow:0 0 0 4px var(--warn-tint)}
.w.missing{color:var(--faint);border-bottom:3px dashed var(--faint);border-radius:0}
.w small{display:block;margin-top:1px;font-size:13px;line-height:1.2;font-weight:700;letter-spacing:0}
.rail{flex:none;display:flex;flex-direction:column;align-items:center;gap:12px}
.rb{width:46px;height:46px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:21px;line-height:1;transition:transform .15s var(--ease),background-color .15s,color .15s}
.rb:active{transform:scale(.93)}
.rb.on{background:var(--accent-tint);color:var(--accent)}
.rb.ask{animation:ask 1.1s var(--ease) 3}

/* The snow leopard. */
.bars svg{display:block;width:100%;height:100%}
.bars.sm{width:50px;height:50px;border-radius:50%;background:var(--accent-tint);padding:3px}
.bars.lg{width:92px;height:92px;flex:none}
.bars.xl{width:164px;height:164px;flex:none}
.bars .e-happy,.bars .e-wink,.bars .m-open{display:none}
.bars .e-open{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
.bars[data-mood=happy] .e-open,.bars[data-mood=happy] .m-smile{display:none}
.bars[data-mood=happy] .e-happy,.bars[data-mood=happy] .m-open{display:inline}
.bars[data-mood=happy]{animation:hop .5s var(--ease) 2}
.bars[data-mood=wink] .e-open.r{display:none}
.bars[data-mood=wink] .e-wink{display:inline}
.bars[data-mood=listen] .e-open{animation:none;transform:scale(1.18)}

/* Status line, action zone, foot. */
.status{min-height:62px;margin-top:8px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;text-align:center}
.stars{display:flex;gap:6px}
.stars svg{width:30px;height:30px}
.stars path,.st path{fill:var(--line);stroke:var(--line);stroke-width:1.6;stroke-linejoin:round}
.stars .f path,.st .f path{fill:var(--star);stroke:var(--star)}
.stars .a{animation:pop .4s var(--ease) both}
.msg{font-size:15px;line-height:1.35;font-weight:700;color:var(--sub);max-width:310px;text-wrap:balance}
.msg.ok{color:var(--ok)}
.msg.warn{color:var(--warn)}
.act{min-height:134px;margin-top:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.pill{width:min(100%,300px);min-height:56px;padding:0 26px;border-radius:28px;background:var(--surface);color:var(--ink);font-size:17px;font-weight:800;transition:transform .15s var(--ease),background-color .15s}
.pill:active{transform:scale(.97)}
.pill.primary{background:var(--accent);color:#fff}
.pill.primary:active{background:var(--accent-press)}
.pill.small{width:auto;min-height:44px;font-size:15px}
.micbox{position:relative;width:128px;height:128px;display:grid;place-items:center}
.ring{position:absolute;top:0;left:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:7}
.ring .trk{stroke:var(--accent-tint)}
.ring .prg{stroke:var(--accent);stroke-linecap:round;stroke-dasharray:377;stroke-dashoffset:377;transition:stroke .2s}
.micbox.over .prg{stroke:var(--warn-line)}
.halo{position:absolute;width:92px;height:92px;border-radius:50%;background:var(--accent-tint);transition:transform .09s linear}
.mic{position:relative;width:92px;height:92px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;transition:transform .15s var(--ease),background-color .15s}
.mic:active{transform:scale(.96);background:var(--accent-press)}
.mic .i{width:36px;height:36px;grid-area:1/1}
.mic .i-stop,.mic .i-dots{display:none}
.micbox.rec .i-mic{display:none}
.micbox.rec .i-stop{display:block}
.micbox.busy .i-mic,.micbox.busy .i-stop{display:none}
.micbox.busy .i-dots{display:block}
.i-dots circle{animation:dots 1.1s infinite}
.i-dots circle:nth-child(2){animation-delay:.15s}
.i-dots circle:nth-child(3){animation-delay:.3s}
.foot{margin-top:6px;min-height:24px;display:flex;align-items:center;justify-content:center;gap:5px;font-size:13px;font-weight:600;color:var(--sub);text-align:center}
.foot .i{width:16px;height:16px}
.foot.up{color:var(--ink)}
.foot.up .i{animation:nudge 1.4s var(--ease) infinite}
.foot.shake{animation:shake .4s}
.link{font-size:13px;font-weight:600;color:var(--sub);text-decoration:underline;text-underline-offset:3px;padding:6px 8px}

/* Welcome and summary cards. */
.hero{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.hero h1{margin-top:8px;font-size:34px;line-height:1.15;font-weight:800;letter-spacing:-.02em}
.lead{font-size:17px;line-height:1.45;font-weight:500;color:var(--sub);max-width:310px}
.consent .lead{font-size:15px}
.summary .hero{justify-content:flex-start;gap:6px;overflow-y:auto;overscroll-behavior:contain;padding-top:4px}
.summary .hero h1{font-size:28px;margin-top:2px}
.summary .lead{font-size:15px}
.sum{list-style:none;padding:0;width:100%;margin-top:6px}
.sum li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px;font-weight:600}
.sum li>span:first-child{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.st{display:flex;gap:2px;flex:none}
.st svg{width:17px;height:17px}
.hard{width:100%;margin-top:10px;text-align:left}
.hard p{margin-bottom:7px;font-size:13px;font-weight:700;color:var(--sub)}
.chip{display:inline-block;margin:0 6px 6px 0;padding:5px 10px;border-radius:10px;background:var(--warn-tint);color:var(--warn);font-size:14px;font-weight:700}

/* Tabs on top (Reels | Modullar) and the modules screen. */
.tabs{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;justify-content:center;padding:calc(8px + env(safe-area-inset-top)) 16px 6px;background:var(--bg)}
.tabs-in{display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--surface)}
.tab{min-width:112px;min-height:40px;padding:0 18px;border-radius:999px;font-size:15px;font-weight:800;color:var(--sub);transition:background-color .15s,color .15s}
.tab.on{background:var(--bg);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.mods{position:fixed;left:0;right:0;bottom:0;top:calc(var(--tabs-h) + env(safe-area-inset-top));overflow-y:auto;overscroll-behavior:contain;background:var(--bg)}
.mods-in{width:min(100%,480px);margin:0 auto;padding:8px 20px calc(28px + env(safe-area-inset-bottom))}
.overall{display:flex;align-items:center;gap:10px}
.bar{position:relative;flex:1;height:32px;border-radius:16px;background:var(--surface);overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:16px;background:var(--accent);transition:width .4s var(--ease)}
.bar span{position:relative;display:block;line-height:32px;text-align:center;font-size:14px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.reset{flex:none;width:44px;height:44px;border-radius:50%;background:var(--accent-tint);color:var(--accent);display:grid;place-items:center}
.confirm{display:flex;align-items:center;gap:8px;margin-top:10px;padding:10px 12px;border-radius:14px;background:var(--accent-tint);font-size:14px;font-weight:700;color:var(--ink)}
.confirm span{flex:1}
.confirm button{min-height:36px;padding:0 14px;border-radius:18px;font-size:14px;font-weight:800;background:var(--bg);color:var(--ink)}
.confirm button.go{background:var(--accent);color:#fff}
.search{display:flex;align-items:center;gap:10px;margin-top:14px;padding:0 16px;height:52px;border-radius:16px;background:var(--surface);color:var(--sub)}
.search input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:16px;font-weight:600;color:var(--ink);outline:none;-webkit-user-select:text;user-select:text;-webkit-appearance:none;appearance:none}
.sect{margin:24px 0 10px;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--sub)}
.mod,.hit{display:flex;align-items:center;gap:14px;width:100%;margin-bottom:12px;padding:16px;border:1px solid var(--line);border-radius:20px;background:var(--bg);text-align:left;transition:transform .15s var(--ease),background-color .15s}
.mod:active,.hit:active{transform:scale(.98);background:var(--surface)}
.badge{flex:none;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--accent-tint);color:var(--accent);font-size:20px;font-weight:800}
.mod-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.mt{font-size:18px;font-weight:800;color:var(--ink)}
.mt .wk{display:inline-block;margin-left:6px;padding:2px 8px;border-radius:999px;background:var(--accent-tint);color:var(--accent);font-size:12px;font-weight:800;vertical-align:3px}
.ms{display:flex;align-items:center;gap:4px;font-size:14px;font-weight:600;color:var(--sub)}
.ms .i{width:15px;height:15px}
.mbar{display:flex;align-items:center;gap:10px;margin-top:6px}
.mbar b{flex:1;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.mbar b i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.mod.full .mbar b i{background:var(--ok)}
.mbar span{min-width:42px;text-align:right;font-size:13px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.chev{flex:none;width:20px;height:20px;color:var(--faint)}
.hit{flex-wrap:wrap;gap:6px 10px}
.hit-t{flex:1 1 100%;font-size:16px;font-weight:700;color:var(--ink)}
.hit-m{flex:1;font-size:13px;font-weight:700;color:var(--sub)}
.empty{padding:24px 8px;text-align:center;font-size:15px;font-weight:600;color:var(--sub)}

/* Bottom sheet: technical info and the admin picker. */
.sheet-wrap{position:fixed;top:0;right:0;bottom:0;left:0;z-index:10;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.32)}
.sheet{width:min(100%,480px);max-height:84%;overflow:auto;background:#fff;border-radius:24px 24px 0 0;padding:10px 20px calc(18px + env(safe-area-inset-bottom))}
.grab{width:36px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.sheet h2{margin-bottom:12px;font-size:20px;font-weight:800}
.sheet label{display:block;margin-bottom:6px;font-size:13px;font-weight:700;color:var(--sub)}
.sheet select{display:block;width:100%;margin-bottom:14px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:15px;font-weight:600}
.sheet pre{margin:0;padding:12px;border-radius:12px;background:var(--surface);color:#3a3a3c;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere;-webkit-user-select:text;user-select:text}
.sheet .row{display:flex;gap:10px;margin-top:14px}
.sheet .row .pill{flex:1;width:auto;min-height:50px;font-size:15px}
.note{margin-top:12px;font-size:12px;line-height:1.5;color:var(--sub);text-align:center}

/* Teacher mode: groups, students, the week's module, a student's lesson and the reports. */
.teach{position:fixed;top:0;right:0;bottom:0;left:0;z-index:4;overflow-y:auto;overscroll-behavior:contain;background:var(--bg)}
.teach-in{width:min(100%,480px);margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 20px calc(28px + env(safe-area-inset-bottom))}
body.t-busy .teach-in{opacity:.55;pointer-events:none}
.t-head{display:flex;align-items:center;gap:12px;margin:6px 0 2px}
.t-top{display:flex;align-items:center;gap:4px;min-height:44px;margin-top:2px}
.t-top .t-title{flex:1;min-width:0}
.t-back{flex:none;width:40px;height:40px;margin-left:-10px;border-radius:50%;display:grid;place-items:center}
.t-back:active{background:var(--surface)}
.t-title{font-size:24px;line-height:1.2;font-weight:800;letter-spacing:-.01em;overflow-wrap:anywhere}
.t-sub{margin-top:4px;font-size:14px;font-weight:600;color:var(--sub)}
.t-sub a{color:var(--accent);font-weight:700}
.t-msg{margin:12px 0 0;padding:10px 12px;border-radius:12px;background:var(--warn-tint);color:var(--warn);font-size:14px;font-weight:700}
.t-card{margin-top:14px;padding:16px;border-radius:20px;background:var(--surface)}
.t-k{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--sub)}
.t-big{margin-top:4px;font-size:20px;font-weight:800}
.t-big.warn{color:var(--warn)}
.t-big.ok{color:var(--ok)}
.t-list{margin:10px 0 0;padding-left:20px;font-size:15px;font-weight:600;line-height:1.45}
.t-list small{color:var(--warn);font-weight:700}
.t-hw{margin-top:8px;font-size:14px;font-weight:600;color:var(--sub)}
.t-link{display:block;margin-top:12px;font-size:14px;font-weight:700;color:var(--accent);text-align:left}
.t-weeks{display:flex;gap:10px;margin-top:12px}
.t-week{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:800;color:var(--sub)}
.t-week small{font-weight:600}
.t-week select,.t-form input:not([type=checkbox]),.t-form select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:16px;font-weight:600;-webkit-user-select:text;user-select:text}
.t-row{display:flex;align-items:center;gap:10px;min-height:56px;border-bottom:1px solid var(--line)}
.t-name{flex:1;min-width:0;padding:10px 0;text-align:left;font-size:16px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t-name small{font-weight:600;color:var(--sub)}
.t-chip{flex:none;padding:6px 10px;border-radius:10px;background:var(--surface);font-size:13px;font-weight:800;color:var(--sub)}
.t-chip.ok{background:#e6f4ea;color:var(--ok)}
.t-chip.warn{background:var(--warn-tint);color:var(--warn)}
.t-start{flex:none;min-height:40px;padding:0 16px;border-radius:20px;background:var(--accent);color:#fff;font-size:14px;font-weight:800}
.t-start:active{background:var(--accent-press)}
.t-btn{flex:none;min-height:36px;padding:0 12px;border-radius:18px;background:var(--surface);font-size:13px;font-weight:800}
.t-btn.go{background:var(--accent);color:#fff}
.t-wide{display:block;width:100%;margin-top:14px}
.t-foot{display:flex;justify-content:center;gap:8px;margin-top:18px}
.t-line.warn{color:var(--warn)}
.t-form{display:flex;flex-direction:column;gap:14px;margin-top:10px}
.t-form label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:800;color:var(--sub)}
.t-lab{font-size:13px;font-weight:800;color:var(--sub)}
.t-days{display:flex;gap:6px;margin-top:-8px}
.t-form .t-day{display:block;flex:1;position:relative}
.t-day input{position:absolute;opacity:0;pointer-events:none}
.t-day span{display:grid;place-items:center;height:44px;border-radius:12px;background:var(--surface);font-size:14px;font-weight:800;color:var(--sub)}
.t-day input:checked+span{background:var(--accent);color:#fff}
.t-form .t-check{flex-direction:row;align-items:flex-start;gap:10px;font-size:14px;font-weight:600;color:var(--ink)}
.t-check input{width:22px;height:22px;flex:none;margin:1px 0 0;accent-color:var(--accent)}
.t-wrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;font-weight:600}
.t-wrow span:first-child{flex:1}
.t-rep{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;padding:10px 0;border-bottom:1px solid var(--line);text-align:left}
.t-rs{font-size:13px;font-weight:600;color:var(--sub)}
.t-keldi{flex:none;min-height:36px;padding:0 10px;border-radius:18px;border:1.5px solid var(--line);background:var(--bg);font-size:13px;font-weight:800;color:var(--sub)}
.t-keldi.on{background:#e6f4ea;border-color:#e6f4ea;color:var(--ok)}
.t-url{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--bg);font-size:14px;font-weight:700;overflow-wrap:anywhere;-webkit-user-select:text;user-select:text}
.t-btns{display:flex;gap:8px;margin-top:10px}

/* TezHolo: hologram kurash wrestler. Plain script, no dependencies.

   Mass is in kg: 30 = the starting figure, 100 = the top form, growth goes on (slower) to 150. */
(function(){

function easeInOut(u){u=clamp(u,0,1);return u<0.5?2*u*u:1-Math.pow(-2*u+2,2)/2;}
function hash(n){var x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x);}

function rgba(c,a){return 'rgba('+c[0]+','+c[1]+','+c[2]+','+(a<0?0:(a>1?1:a)).toFixed(3)+')';}
function clampKg(v){v=+v;return v===v?clamp(v,KG_MIN,KG_MAX):KG_MIN;}
function round1(v){return Math.round(v*10)/10;}
function mk(){return document.createElement('canvas');}
function now(){return (window.performance&&performance.now)?performance.now():Date.now();}
function along(o,d,l){return [o[0]+d[0]*l,o[1]+d[1]*l];}

/* monotone cubic through (x, y) keys */
function makeProfile(keys){
  var n=keys.length,d=[],tg=[],i;
  for(i=0;i<n-1;i++)d[i]=(keys[i+1][1]-keys[i][1])/(keys[i+1][0]-keys[i][0]);

    if(y<=keys[0][0])return keys[0][1];

var massCurve=makeProfile([[30,0],[35,0.12],[45,0.3],[60,0.52],[80,0.76],[100,1],[150,1.24]]);

  // The ring fills with the time spent speaking and is full at the target time; past it the colour changes.

  // ---------- WAV 16 kHz mono (what the speech service accepts) ----------
  async function toWav16k(blob, trim) {
    const ctx = state.ctx || ensureContext();
    const ab = await blob.arrayBuffer();
    const decoded = await new Promise((resolve, reject) => {
      try { const p = ctx.decodeAudioData(ab, resolve, reject); if (p && p.then) p.then(resolve, reject); } catch (e) { reject(e); }
    });
    const sr = decoded.sampleRate, ch = decoded.numberOfChannels;
    let mono = new Float32Array(decoded.length);
    for (let c = 0; c < ch; c++) { const d = decoded.getChannelData(c); for (let i = 0; i < d.length; i++) mono[i] += d[i] / ch; }
    if (trim) {
      const s = Math.max(0, Math.floor((trim.start / 1000) * sr)), e = Math.min(mono.length, Math.ceil((trim.end / 1000) * sr));
      if (e - s > sr * 0.4) mono = mono.subarray(s, e);
    }
    const ratio = sr / 16000, outLen = Math.max(1, Math.floor(mono.length / ratio));
    const pcm = new Int16Array(outLen);
    for (let i = 0; i < outLen; i++) {
      const a = Math.floor(i * ratio), b = Math.max(a + 1, Math.min(mono.length, Math.floor((i + 1) * ratio)));
      let sum = 0; for (let k = a; k < b; k++) sum += mono[k];
      const v = Math.max(-1, Math.min(1, sum / (b - a)));
      pcm[i] = v < 0 ? v * 0x8000 : v * 0x7fff;
    }
    return wavBlob(pcm, 16000);
  }

  // ---------- checking ----------

  // ---------- profile: the hologram wrestler ----------
  // One screen for the student, the family and the teacher: a kurash wrestler that gains mass (kg) from the lessons;
  // a calendar month is a season. The numbers come from the function tez-aytish-profile, the figure is drawn by
  // TezHolo (the script block above this one). Opened from the family bot @kidscast_bot (?kc=1) the page shows only
  // this screen. A gain the viewer has not watched yet waits for a tap («Massani oshir»): the tap also lets the
  // sound play.
  const PROFILE_API = 'https://trxnsqpdekokqvtefxlt.supabase.co/functions/v1/tez-aytish-profile';
  const family = query.has('kc');
  const COLOR_NAME = { moviy: 'Moviy', yashil: 'Yashil', binafsha: 'Binafsha', oltin: 'Oltin' };
  const holoColors = () => (window.TezHolo && window.TezHolo.COLORS) || { moviy: '#35c8ff', yashil: '#3ddc84', binafsha: '#b18cff', oltin: '#ffc53d' };
  // state: load (waiting for the server), idle (nothing new), ready (a gain waits for the tap), play, done
  const prof = { kids: [], data: null, id: null, holo: null, back: '', lessonKey: null, from: null, state: 'idle', msg: '', ticks: 0 };
  const kgText = (n) => String(Math.round(Number(n) * 10) / 10).replace('.', ',');
  const capFirst = (s) => s.charAt(0).toUpperCase() + s.slice(1);

  async function papi(action, body, ms) {
    if (mock) return mockProfile(action, body || {});
    return callJson(`${PROFILE_API}/${action}`, { method: 'POST', headers: { 'x-telegram-init-data': tg.initData, 'content-type': 'application/json' }, body: JSON.stringify(body || {}) }, ms || 20000);
  }
  const pErr = (e) => (e.code === 'invalid_or_expired_init_data' ? 'Sessiya eskirdi: Mini Appʼni yopib, qayta oching.' : e.code === 'student_not_found' ? 'Profil topilmadi. Oʻqituvchidan yangi havola soʻrang.'
    : e.code === 'timeout' ? 'Server javob bermadi. Internetni tekshirib, qayta urinib koʻring.' : `Profilni ochib boʻlmadi (${e.message}).`);

  function dropHolo() {
    if (!prof.holo) return;
    try { prof.holo.stop(); prof.holo.destroy(); } catch (e) { /* the canvas goes away anyway */ }
    prof.holo = null;
  }
  // back: where «Orqaga» returns to ('welcome', 'student', 'summary'); none in the family bot, where this is the only screen.
  async function openProfile(id, opts) {
    const o = opts || {};
    dropHolo();
    Object.assign(prof, { id, back: o.back || '', lessonKey: o.lessonKey || null, gain: o.gain || 'lesson', data: null, from: null, state: 'load', msg: '' });
    const show = () => { stopVoice(); $('prof').classList.remove('hide'); $('prof').scrollTop = 0; };
    // After a lesson the screen comes up only once the lesson's gain is known: the summary is not hidden by a wait.
    if (!o.lessonKey) { show(); renderProfile(); }
    try {
      const d = await papi('get', o.lessonKey ? { studentId: id, lessonKey: o.lessonKey } : { studentId: id }, o.lessonKey ? 8000 : 0);
      if (prof.id !== id || prof.state !== 'load') return;
      const gain = o.lessonKey ? (o.gain === 'home' ? d.home : d.lesson) : null;
      if (o.lessonKey) {
        // Only that gain is shown; without one, or if the child has moved on, there is nothing to watch.
        const owner = o.gain === 'home' ? state.hw : state.lesson;
        const here = owner && owner.studentId === id && state.summaryEl && state.activeEl === state.summaryEl;
        const line = here && state.summaryEl.querySelector('[data-r="mass"]');

      prof.data = d;
      prof.from = d.kg > from ? from : null;
      prof.state = prof.from === null ? 'idle' : 'ready';
      renderProfile();
      mountHolo();
    } catch (e) {
      if (prof.id !== id) return;

      prof.msg = pErr(e);

  function closeProfile() {

    $('prof').classList.add('hide');

  function mountHolo() {
    const d = prof.data, cv = $('pCanvas');
    dropHolo();
    if (!d || !cv || !window.TezHolo) return;
    try {
      prof.holo = window.TezHolo.create(cv, { kg: prof.from !== null ? prof.from : d.kg, char: d.student.figure, color: d.student.color, dim: !!d.student.dim, onKg: showKg, fx: gainFx });

  }
  // The number under the figure and the title that belongs to it (while the figure grows the number runs in whole kg).
  function showKg(kg) {
    const d = prof.data, el = $('pKg'), tl = $('pTitle');
    if (!d || !el || !tl) return;
    el.textContent = kgText(prof.state === 'play' ? Math.max(Math.floor(kg), prof.from) : kg);
    let i = 0;
    d.titles.forEach((t, k) => { if (kg >= t.from) i = k; });
    if (tl.dataset.i === String(i)) return;
    const first = tl.dataset.i === undefined;
    tl.dataset.i = String(i);
    tl.textContent = d.titles[i].name;
    if (first || prof.state !== 'play') return;
    tl.classList.remove('pop'); void tl.offsetWidth; tl.classList.add('pop'); // a new title in the middle of the growth

  }
  function gainFx(name) {
    if (name === 'start') { prof.ticks = 0; haptic('impact'); if (state.sound) tone(196, 0, 0.5, 'sine', 0.07); }
    else if (name === 'tick') { prof.ticks++; if (state.sound) tone(392 + Math.min(prof.ticks, 24) * 22, 0, 0.07, 'triangle', 0.05); if (prof.ticks % 2) haptic('light'); }
    else if (name === 'burst') { sfx('win', 3); haptic('success'); }
  }
  function claimGain() {
    const d = prof.data;
    if (prof.state !== 'ready' || !d) return;
    prof.state = 'play';
    paintProfAct();
    const id = prof.id;
    let finished = false;
    const done = () => {
      clearTimeout(guard);
      if (finished || prof.id !== id) return;
      finished = true;
      prof.state = 'done';
      showKg(d.kg);
      paintProfAct();
      const kid = prof.kids.find((k) => k.id === id);
      if (kid) Object.assign(kid, { kg: d.kg, title: d.student.title, titleName: d.student.titleName });
      papi('seen', { studentId: id, kg: d.kg }).catch(() => {});
    };
    // The growth takes about 3.5 s. If the page cannot animate (it went to the background), the mass still arrives.
    const guard = setTimeout(() => {
      if (finished || prof.id !== id) return;
      try { if (prof.holo) prof.holo.set({ kg: d.kg }); } catch (e) { /* the number below is set anyway */ }
      done();
    }, 8000);
    if (prof.holo) { try { return prof.holo.gain(prof.from, d.kg, done); } catch (e) { state.jsError = `holo: ${e.message}`; } }
    done();
  }
  function paintProfAct() {
    const d = prof.data, box = $('pAct'), plus = $('pPlus');
    if (!d || !box || !plus) return;
    const gain = prof.from !== null ? Math.round((d.kg - prof.from) * 10) / 10 : 0;
    plus.textContent = `+${kgText(gain)}`;
    plus.classList.toggle('hide', !(gain > 0));
    box.innerHTML = prof.state === 'ready' ? `<button class="pill primary p-claim" type="button" data-p="claim">💪 Massani oshir · +${kgText(gain)} kg</button>`
      : prof.state === 'done' && prof.lessonKey ? '<button class="pill primary" type="button" data-p="back">Davom etish</button>' : '';
  }
  const lookHtml = (s) => `<div class="p-seg" role="group" aria-label="Qahramon">${[['m', 'Oʻgʻil'], ['f', 'Qiz']].map(([v, t]) => `<button type="button" data-p="fig" data-v="${v}" class="${s.figure === v ? 'on' : ''}" aria-pressed="${s.figure === v}">${t}</button>`).join('')}</div>`
    + `<div class="p-dots" role="group" aria-label="Rang">${Object.keys(holoColors()).map((c) => `<button type="button" class="p-dot${s.color === c ? ' on' : ''}" data-p="color" data-v="${esc(c)}" style="background:${esc(holoColors()[c])}" aria-label="${esc(COLOR_NAME[c] || c)}" aria-pressed="${s.color === c}"></button>`).join('')}</div>`;
  // Badges are earned again every season; the ones still to get are shown greyed, so the child knows what to aim at.
  const BADGE_ICON = { first3: '⭐', perfect: '🎯', module: '🧩', week_star: '🏅', no_miss: '📅' };
  function badgesHtml(d) {

  // The group's stars this week: names and stars only, never another child's figure.

      + `${place > 3 ? `<div class="p-wrow me"><i>${place}</i><span>${esc(d.student.firstName)}</span><b>${(w.all[place - 1] || {}).stars || 0} ⭐</b></div>` : ''}</div>`;

  }
  const medalHtml = (m) => `<div class="p-row medal"><span><b>🏅 ${esc(capFirst(MONTHS[Number(m.season.slice(5, 7)) - 1]))} ${esc(m.season.slice(0, 4))}</b><small>${esc(m.titleName)} · ${m.lessons} ta dars · ${m.stars} ⭐</small></span><b>${kgText(m.kg)} kg</b></div>`;
  const rulesHtml = (d) => `<p class="p-rules"><b>Massa qanday oshadi?</b><br>Darsga kelish: +2 kg. Darsda aytilgan har bir tez aytish: +0,5 kg. Har bir yulduz: +0,5 kg. Hafta davomida hech bir dars qoldirilmasa: yana +3 kg.<br>`
    + `<b>Unvonlar:</b> ${d.titles.map((t) => `${esc(t.name)} — ${t.from} kg`).join(', ')}.<br>Har oy yangi mavsum ${kgText(d.startKg)} kg dan boshlanadi, oldingi oyning natijasi medal boʻlib qoladi.</p>`;
  function renderProfile() {
    const d = prof.data, box = $('profIn'), lesson = !!prof.lessonKey;

  async function setLook(patch) {
    const d = prof.data;
    if (!d) return;
    const s = d.student, old = { figure: s.figure, color: s.color };
    const apply = (v) => { Object.assign(s, v); if (prof.holo) prof.holo.set({ char: s.figure, color: s.color }); if ($('pSet')) $('pSet').innerHTML = lookHtml(s); };
    apply(patch);
    haptic('light');
    try {
      await papi('set', { studentId: s.id, ...patch });
      const kid = prof.kids.find((k) => k.id === s.id);
      if (kid) Object.assign(kid, patch);
    } catch (e) { if (prof.data === d) apply(old); }
  }
  $('prof').addEventListener('click', (e) => {
    const b = e.target.closest('[data-p]');
    if (!b || b.disabled) return;
    ensureContext(); // the gain's sounds need a context that was started inside a tap
    const a = b.dataset.p;
    if (a === 'sound') { toggleSound(); b.innerHTML = state.sound ? ICON.sound : ICON.mute; b.setAttribute('aria-pressed', String(!state.sound)); return; }
    if (prof.state === 'play') return;
    if (a === 'back') return closeProfile();
    if (a === 'retry') return openProfile(prof.id, { back: prof.back });
    if (a === 'claim') return claimGain();
    if (a === 'hw') return startHomework();
    if (a === 'tap') { if (prof.holo) prof.holo.tap(); return haptic('light'); }
    if (a === 'kid') return b.dataset.id === prof.id ? null : openProfile(b.dataset.id, { back: prof.back });
    if (a === 'fig') return setLook({ figure: b.dataset.v });
    if (a === 'color') return setLook({ color: b.dataset.v });
  });
  document.addEventListener('visibilitychange', () => { if (prof.holo) { try { if (document.hidden) prof.holo.stop(); else prof.holo.start(); } catch (e) { /* drawn again on the next open */ } } });
  window.addEventListener('resize', () => { if (prof.holo) { try { prof.holo.resize(); } catch (e) { /* keeps the old size */ } } });

  // Teacher mode: the masses of a group's students for the team strip, the student card and the report.
  async function ensureMass(force) {
    const gid = teach.groupId;
    if (!gid || (!force && teach.mass && teach.mass.groupId === gid)) return;
    try {
      const r = await papi('group', { groupId: gid });
      teach.mass = { groupId: gid, map: new Map((r.students || []).map((s) => [s.id, s])) };
    } catch (e) { if (!teach.mass || teach.mass.groupId !== gid) teach.mass = { groupId: gid, map: new Map() }; }
    if (teach.groupId === gid && ['group', 'student', 'report'].includes(teach.view) && $('prof').classList.contains('hide') && !$('teach').classList.contains('hide')) {
      const y = $('teach').scrollTop;
      renderTeach();
      $('teach').scrollTop = y;
    }
  }
  const massOf = (id) => (teach.mass && teach.mass.groupId === teach.groupId && teach.mass.map.get(id)) || null;
  const miniHtml = (m, cls) => `<canvas class="t-mini${cls || ''}" data-kg="${Number(m.kg)}" data-fig="${m.figure === 'f' ? 'f' : 'm'}" data-color="${esc(m.color)}"${m.dim ? ' data-dim="1"' : ''} aria-hidden="true"></canvas>`;
  function teamHtml(g) {
    if (!window.TezHolo || !g.students.some((s) => massOf(s.id))) return '';
    return `<div class="t-team">${g.students.map((s) => { const m = massOf(s.id); return m ? `<button class="t-fig" type="button" data-t="student" data-id="${esc(s.id)}">${miniHtml(m)}<b>${esc(s.firstName)}</b><small>${kgText(m.kg)} kg</small></button>` : ''; }).join('')}</div>`;
  }
  function figureCardHtml(s) {
    const m = massOf(s.id);
    if (!m) return '';
    const seg = [['m', 'Oʻgʻil'], ['f', 'Qiz']].map(([v, t]) => `<button type="button" data-t="fig" data-v="${v}" class="${m.figureSet && m.figure === v ? 'on' : ''}" aria-pressed="${!!m.figureSet && m.figure === v}">${t}</button>`).join('');
    return `<div class="t-card t-figcard">${window.TezHolo ? miniHtml(m, ' big') : ''}<div class="t-figinfo"><p class="t-big">${kgText(m.kg)} kg · ${esc(m.titleName)}</p>`
      + `<p class="t-sub">${m.dim ? 'Oxirgi darsga kelmadi: gologramma xira' : m.figureSet ? 'Kurashchi qahramoni' : 'Qahramonni tanlang'}</p><div class="p-seg" role="group" aria-label="Qahramon">${seg}</div></div>`
      + '<button class="pill t-wide" type="button" data-t="profile">💪 Profilni ochish</button></div>';
  }
  // Teacher mode is redrawn after every tap, so a mini figure is drawn once per look and size and then copied.
  const miniCache = new Map();
  function paintMinis(root) {
    if (!window.TezHolo) return;
    root.querySelectorAll('canvas.t-mini').forEach((cv) => {
      try {
        const key = `${cv.dataset.kg}|${cv.dataset.fig}|${cv.dataset.color}|${cv.dataset.dim || ''}|${cv.clientWidth}x${cv.clientHeight}`, hit = miniCache.get(key);
        if (hit) { cv.width = hit.width; cv.height = hit.height; cv.getContext('2d').drawImage(hit, 0, 0); return; }
        window.TezHolo.mini(cv, { kg: Number(cv.dataset.kg), char: cv.dataset.fig, color: cv.dataset.color, dim: !!cv.dataset.dim });
        const copy = document.createElement('canvas');
        copy.width = cv.width; copy.height = cv.height;
        copy.getContext('2d').drawImage(cv, 0, 0);
        if (miniCache.size > 120) miniCache.clear();
        miniCache.set(key, copy);
      } catch (e) { /* the tile stays dark */ }
    });
  }
  async function setTeachFigure(v) {
    const sid = teach.studentId, m = massOf(sid);
    if (!m || (v !== 'm' && v !== 'f') || teach.busy) return;
    try {
      const r = await papi('set', { studentId: sid, figure: v });
      Object.assign(m, { figure: r.figure, figureSet: true });
      teach.msg = '';
    } catch (e) { teach.msg = tErr(e); }
    if (teach.studentId === sid && teach.view === 'student') renderTeach();
  }
  // The family bot opens the page with its own initData, which the trainer's other functions do not accept: only the profile.
  async function initFamily() {
    try {
      // The profile needs only the mass; the homework also needs the tongue twisters and the narrator samples.
      const [me, s] = await Promise.all([papi('me'), api('session').catch((e) => { state.teachError = e.message; return null; })]);
      prof.kids = Array.isArray(me.kids) ? me.kids : [];
      if (s) {
        state.isAdmin = !!s.isAdmin;
        state.sttReady = !!(s.sttReady ?? s.speechReady);
        state.provider = s.sttProvider || '';
        state.twisters = Array.isArray(s.twisters) ? s.twisters : [];
      }
      state.server = 'ok';
    } catch (e) {
      state.server = `xato: ${e.message}`;
      renderDiag();
      return welcome('error', e.code === 'invalid_or_expired_init_data' ? 'Sessiya eskirdi: Mini Appʼni yopib, qayta oching.' : `Serverga ulanib boʻlmadi (${e.message}). Internetni tekshirib, qayta urinib koʻring.`);
    }
    renderDiag();
    if (!prof.kids.length) return welcome('info', 'Bu yerda farzandingizning «Tez aytish» profili chiqadi. Avval oʻqituvchidan shaxsiy havolani oling va uni @kidscast_bot ichida oching.');
    welcome('info', 'Profil ochilmoqda…');
    const want = query.get('s'), kid = prof.kids.find((k) => k.id === want) || prof.kids[0];
    if (query.has('hw') && state.twisters.length) return startHomework(kid.id);
    openProfile(kid.id, {});
  }

  // Local preview only: the profile back end over the mock teacher data (?mock=1; with &kc=1 the family view, with
  // &kids=1 a practice user who has linked children).
  const MOCKP = { base: { s1: 41.5 }, look: { s1: { figure: 'm', figureSet: true, color: 'moviy' } }, seen: { s1: 38.5 }, home: {}, praised: {} };
  const P_BADGES = [{ kind: 'first3', name: 'Birinchi 3 yulduz', note: 'Mavsumda birinchi marta 3 yulduz' },
    { kind: 'perfect', name: 'Toʻliq dars', note: 'Bir darsdagi hamma tez aytish 3 yulduzga' },
    { kind: 'module', name: 'Modul ustasi', note: 'Haftaning barcha tez aytishlari 3 yulduzga (darsda yoki uyda)' },
    { kind: 'week_star', name: 'Hafta yulduzi', note: 'Guruhda hafta davomida eng koʻp yulduz' },
    { kind: 'no_miss', name: 'Darssiz oy', note: 'Oy davomida bironta dars qoldirilmadi' }];
  const P_TITLES = [{ from: 30, name: 'Yangi kurashchi' }, { from: 35, name: 'Havaskor' }, { from: 45, name: 'Sportchi' }, { from: 60, name: 'Polvon' }, { from: 80, name: 'Chempion' }, { from: 100, name: 'Afsona' }];
  function mockProfile(action, b) {
    return new Promise((resolve, reject) => setTimeout(() => { try { resolve(mockProfileNow(action, b)); } catch (e) { reject(e); } }, 150));
  }
  function mockProfileNow(action, b) {
    const today = tday(Date.now()), season = `${today.slice(0, 7)}-01`;
    const all = MOCKT.groups.filter((g) => !g.archived).flatMap((g) => g.students.filter((s) => s.active).map((s) => ({ g, s })));
    const lessons = (s) => {
      const keys = [...new Set([...MOCKT.results.filter((r) => r.studentId === s.id).map((r) => r.key), ...Object.keys(MOCKT.attendance).filter((k) => k.startsWith(`${s.id}|`)).map((k) => k.split('|')[1])])].sort();
      return keys.map((key) => { const rs = MOCKT.results.filter((r) => r.studentId === s.id && r.key === key), stars = rs.reduce((a, r) => a + r.stars, 0); return { key, said: rs.length, stars, kg: 2 + 0.5 * rs.length + 0.5 * stars }; });
    };
    const lookOf = (id) => MOCKP.look[id] || (MOCKP.look[id] = { figure: 'm', figureSet: false, color: 'moviy' });
    const brief = ({ g, s }) => {
      const hwKg = mockHwKg({ g, s });
      const kg = (MOCKP.base[s.id] || 30) + lessons(s).reduce((a, l) => a + l.kg, 0) + (hwKg ? hwKg.kg : 0);
      let i = 0;
      P_TITLES.forEach((t, k) => { if (kg >= t.from) i = k; });
      return { id: s.id, kg, title: i, titleName: P_TITLES[i].name, dim: false, ...lookOf(s.id), name: sname(s), firstName: s.firstName, group: g.name };
    };
    const find = (id) => all.find((x) => x.s.id === id) || mockFail('student_not_found');
    if (action === 'badgesOnly') return null;
    if (action === 'homework') { const x = find(b.studentId); return { ok: true, staff: !family, today, studentId: x.s.id, name: sname(x.s), firstName: x.s.firstName, group: x.g.name, ...mockHwOf(x) }; }
    if (action === 'me') return { ok: true, role: MOCKT.role, via: 'mock', season, today, titles: P_TITLES, kids: family || query.has('kids') ? all.map(brief) : [] };
    if (action === 'group') {
      return { ok: true, groupId: b.groupId, season, today, titles: P_TITLES, students: all.filter((x) => x.g.id === b.groupId).map((x) => {
        const h = mockHwOf(x);
        return { ...brief(x), homework: { state: h.state, left: h.left, total: h.total } };
      }) };
    }
    if (action === 'seen') { find(b.studentId); MOCKP.seen[b.studentId] = b.kg; return { ok: true }; }
    if (action === 'set') {
      find(b.studentId);
      const look = lookOf(b.studentId);
      if (b.figure) Object.assign(look, { figure: b.figure, figureSet: true });
      if (b.color) look.color = b.color;
      return { ok: true, ...look };
    }
    if (action === 'get') {
      const x = find(b.studentId), st = brief(x), ls = lessons(x.s), base = MOCKP.base[x.s.id] || 30, ws = wsOf(today);
      const history = ls.map((l) => ({ type: 'lesson', day: l.key, kg: l.kg, said: l.said, stars: l.stars })).reverse();
      if (base > 30) history.push({ type: 'week', day: ws, kg: 3 }, { type: 'lesson', day: addD(ws, -1), kg: base - 33, said: 4, stars: 9 }, { type: 'missed', day: addD(ws, -2), kg: 0 });
      const lesson = b.lessonKey ? ls.find((l) => l.key === b.lessonKey) || null : null, seen = MOCKP.seen[x.s.id];
      const hw = mockHwOf(x), hwGain = mockHwKg(x);
      return { ok: true, staff: !family, today, student: st, season: { start: season, end: season, daysLeft: 10 }, kg: st.kg, startKg: 30, stars: 0, titles: P_TITLES, colors: Object.keys(COLOR_NAME),
        seenKg: seen === undefined ? null : seen, lesson: lesson ? { key: lesson.key, kg: lesson.kg, before: st.kg - lesson.kg, said: lesson.said, stars: lesson.stars } : null,
        home: b.lessonKey && hwGain && hwGain.key === b.lessonKey ? { ...hwGain, before: st.kg - hwGain.kg } : null,
        homework: { state: hw.state, left: hw.left, total: hw.total, due: hw.due, dueLabel: hw.dueLabel, missed: hw.missed },
        badges: mockBadgesOf(x), streak: 0, week: mockWeekOf(x.g, x.s.id), history,
        medals: base > 30 ? [{ season: `${addD(season, -1).slice(0, 7)}-01`, kg: 62.5, title: 3, titleName: 'Polvon', lessons: 8, stars: 41 }] : [] };
    }
    return mockFail('not_found');
  }

  // ---------- homework at home ----------
  // The child opens the trainer from @kidscast_bot and says the tongue twisters the lesson left over. The list and
  // the deadline come from tez-aytish-profile, the checks go to tez-aytish-api /check with home: true (one per
  // tongue twister), and when the last one is done the wrestler gains the mass of the homework.
  function homeworkHtml(d) {
    const h = d.homework;
    if (!h || h.state === 'none') return '';
    if (h.state === 'waiting') return '<div class="p-hw"><b>🏠 Uyga vazifa</b><p>Dars tugagach shu yerda chiqadi.</p></div>';
    if (h.state === 'done') return `<div class="p-hw done"><b>✅ Uyga vazifa bajarildi</b><p>${h.total} ta tez aytish aytildi. Barakalla!</p></div>`;
    const what = h.missed ? 'Darsga kelmading, shuning uchun butun modul uyda' : 'Darsda qiynalgan tez aytishlar';
    return `<div class="p-hw open"><b>🏠 Uyga vazifa: ${h.left} ta tez aytish</b><p>${esc(what)}.${h.dueLabel ? ` ${esc(capFirst(h.dueLabel))}gacha vaqt bor.` : ''}</p>`
      // While a gain is waiting to be watched, the homework button steps back so the two do not shout at once.
      + `<button class="pill${prof.state === 'ready' ? '' : ' primary'}" type="button" data-p="hw">Boshlash</button></div>`;
  }
  // The homework becomes an ordinary session of cards in the feed: the same mic, the same stars.
  async function startHomework(id) {
    const sid = id || prof.id;
    if (!sid || state.recording || state.busy) return;
    const btn = $('profIn') && $('profIn').querySelector('[data-p="hw"]');
    if (btn) { btn.disabled = true; btn.textContent = 'Yuklanmoqda…'; }
    let d = null;
    try { d = await papi('homework', { studentId: sid }); } catch (e) {
      if (btn) { btn.disabled = false; btn.textContent = 'Boshlash'; }
      prof.msg = pErr(e);
      return renderProfile();
    }
    const left = (d.twisters || []).filter((t) => !t.done).map((t) => t.id);
    const at = new Map(state.twisters.map((t, i) => [t.id, i]));
    const list = left.filter((x) => at.has(x)).map((x) => at.get(x));
    if (d.state !== 'open' || !list.length) { prof.msg = 'Uyga vazifa hozir yoʻq.'; return openProfile(sid, { back: prof.back }); }
    state.hw = { studentId: sid, lessonKey: d.lessonKey, name: d.firstName || d.name, total: d.total, due: d.dueLabel, missed: d.missed };
    state.sttReady = true;
    dropHolo();
    $('prof').classList.add('hide');
    showTeach(false);
    state.welcomeEl.classList.add('hide');
    newSession(list, { id: 'home', title: 'Uyga vazifa' });
    begin();
  }
  // The summary of the homework, and the figure growing right after it (the same screen as after a lesson).
  function homeworkSummaryHtml(got) {
    const n = state.cards.length;
    return `${metaHtml('<span class="brand">Uyga vazifa</span>')}
      <div class="hero">
        <div class="bars lg" data-mood="${got ? 'happy' : 'wink'}">${BARS}</div>
        <h1>${got ? 'Barakalla!' : 'Yaxshi urinish!'}</h1>
        <p class="lead">${n} ta tez aytishda ${got} ta yulduz.</p>
        <ul class="sum">${state.cards.map((c) => `<li><span>${esc(c.t.text)}</span><span class="st">${[1, 2, 3].map((i) => starHtml(i <= c.stars)).join('')}</span></li>`).join('')}</ul>
        <p class="lead" data-r="mass"></p>
      </div>
      <div class="act"><button class="pill primary" type="button" data-act="toprof">💪 Profil</button></div>
      <p class="foot"></p>`;
  }
  // The homework of the local preview: the module of the mock lesson, what the lesson gave and what was said at home.
  // Badges and the week board of the local preview: worked out from the mock results, enough to see the screens.
  function mockBadgesOf(x) {
    const l = mockLesson(x.g, tday(Date.now()));
    const rs = MOCKT.results.filter((r) => r.studentId === x.s.id);
    const starsOf = (id) => { const r = rs.find((y) => y.key === l.key && y.id === id); return r ? r.stars : null; };
    const home = (id) => MOCKP.home[`${x.s.id}|${l.key}|${id}`];
    const got = { first3: rs.some((r) => r.stars === 3) || Object.keys(MOCKP.home).some((k) => k.startsWith(`${x.s.id}|`) && MOCKP.home[k] === 3) };
    got.perfect = !!(l.key && l.ids.length && l.ids.every((id) => starsOf(id) === 3));
    got.module = !!(got.perfect && l.homework.every((id) => home(id) === 3));
    return P_BADGES.map((b) => ({ ...b, got: got[b.kind] ? 1 : 0, day: got[b.kind] ? l.key : null, kg: got[b.kind] ? 2 : 0 }));
  }
  function mockWeekOf(g, me) {
    const rows = g.students.filter((s) => s.active).map((s) => ({ id: s.id, name: s.firstName,
      stars: MOCKT.results.filter((r) => r.studentId === s.id).reduce((a, r) => a + r.stars, 0) })).sort((a, b) => b.stars - a.stars);
    return { from: wsOf(tday(Date.now())), top: rows.filter((r) => r.stars > 0).slice(0, 3), all: rows };
  }
  function mockHwOf(x) {
    const today = tday(Date.now()), l = mockLesson(x.g, today);
    const base = { state: 'none', lessonKey: null, due: null, dueLabel: null, missed: false, total: 0, left: 0, twisters: [] };
    if (!l.key || l.status !== 'open') return base;
    const lessonStars = (id) => { const r = MOCKT.results.find((y) => y.studentId === x.s.id && y.key === l.key && y.id === id); return r ? r.stars : null; };
    const said = l.ids.filter((id) => lessonStars(id) !== null).length;
    const dueLabel = l.next ? `${['dushanba', 'seshanba', 'chorshanba', 'payshanba', 'juma', 'shanba', 'yakshanba'][wdOf(l.next) - 1]}, ${Number(l.next.slice(8))}-${MONTHS[Number(l.next.slice(5, 7)) - 1]}` : null;
    const open = { ...base, lessonKey: l.key, due: l.next, dueLabel, missed: said === 0 };
    if (said < l.ids.length) return { ...open, state: 'waiting' };
    const ids = [...l.ids, ...l.homework].filter((id) => l.homework.includes(id) || (lessonStars(id) ?? 0) <= 1);
    const home = (id) => MOCKP.home[`${x.s.id}|${l.key}|${id}`];
    const twisters = ids.map((id) => ({ id, lessonStars: lessonStars(id), stars: home(id) === undefined ? null : home(id), done: home(id) !== undefined }));
    const left = twisters.filter((t) => !t.done).length;
    return { ...open, state: left ? 'open' : 'done', total: twisters.length, left, twisters };
  }
  // What the homework has given the wrestler so far: 0.5 per tongue twister, 0.5 per star above the lesson, 1 for all.
  function mockHwKg(x) {
    const hw = mockHwOf(x);
    if (!hw.twisters.length) return null;
    const done = hw.twisters.filter((t) => t.done);
    if (!done.length) return null;
    const stars = done.reduce((a, t) => a + Math.max(0, t.stars - (t.lessonStars || 0)), 0);
    const whole = done.length >= hw.twisters.length;
    return { key: hw.lessonKey, kg: done.length * 0.5 + stars * 0.5 + (whole ? 1 : 0), said: done.length, of: hw.twisters.length, stars, whole };
  }
  // ---------- start ----------
  async function init() {
    buildWelcome();
    paintTotals();
    renderDiag();
    if (!inTelegram && !mock) return welcome('info', 'Bu trenajyor Telegram ichida ishlaydi. Uni botdagi tugma orqali och.');
    if (family) return initFamily();
    // On a slow connection say so instead of a silent «Yuklanmoqda…».
    const slow = setTimeout(() => { if (!state.server) welcome('info', 'Yuklanmoqda… Internet sekin boʻlsa, biroz kuting.'); }, 7000);
    try {
      // Who is asking in teacher mode comes from tez-aytish-teacher; if that fails, the page works as before.
      // The profile function tells whether this account is linked to students (then the welcome card offers «Profil»).
      // The start does not wait for it.
      papi('me').then((p) => { if (p && Array.isArray(p.kids)) { prof.kids = p.kids; paintProfPill(); renderDiag(); } }).catch(() => {});
      const [s, t] = await Promise.all([api('session'), tapi('state').catch((e) => { state.teachError = e.message; return null; })]);
      state.isAdmin = !!s.isAdmin; state.sttReady = !!(s.sttReady ?? s.speechReady); state.provider = s.sttProvider || '';
      state.sessionStt = state.sttReady;
      state.twisters = Array.isArray(s.twisters) ? s.twisters : [];
      if (t) { teach.data = t; teach.role = t.role || 'none'; }
      state.server = 'ok';
    } catch (e) {
      state.server = `xato: ${e.message}`;
      renderDiag();
      return welcome('error', e.code === 'invalid_or_expired_init_data' ? 'Sessiya eskirdi: Mini Appʼni yopib, qayta och.' : `Serverga ulanib boʻlmadi (${e.message}). Internetni tekshirib, qayta urinib koʻr.`);
    } finally { clearTimeout(slow); }
    document.body.classList.toggle('is-admin', state.isAdmin);
    $('note').textContent = state.isAdmin ? 'Admin rejimi: yozuvlar sozlash uchun saqlanadi.' : 'Ovoz yozuvi saqlanmaydi, faqat natija yoziladi.';
    // A teacher (or the owner) starts in teacher mode: groups, students and the lessons.
    if (teach.role === 'owner' || teach.role === 'teacher') {
      if (!state.twisters.length) return welcome('info', 'Tez aytishlar roʻyxati boʻsh.');
      if (state.isAdmin) fillPicker();
      state.welcomeEl.classList.add('hide');
      showTeach(true);
      // The owner's bot message about a teacher request opens the trainer straight on it (?approve=<telegram id>).
      const ask = Number(query.get('approve'));
      if (teach.role === 'owner' && Number.isSafeInteger(ask) && ask > 0) openView('approve', { approveId: ask });
      else openView('home');
      renderDiag();
      return;
    }
    // Someone who asked to become a teacher waits for the owner's approval.
    if (teach.data && teach.data.status === 'pending') return home('tpending');
    // While the trainer is closed for children they get a friendly 'coming soon' instead of a mic that cannot check.
    if (!state.sttReady && !state.isAdmin) return home('soon');
    if (!state.twisters.length) return welcome('info', 'Tez aytishlar roʻyxati boʻsh.');
    if (state.isAdmin) fillPicker();
    if (!state.isAdmin && !state.consent) return home('consent');
    newSession(dailyList(state.progress.idx));
    home('ready');
    reportMic('opened');
    renderDiag();
  }
  // Anything that breaks the start shows on the screen (and in «Texnik maʼlumot») instead of an endless «Yuklanmoqda…».
  function fatal(e) {
    state.jsError = `${(e && e.name) || 'Error'}: ${(e && e.message) || e}`;
    try { renderDiag(); } catch (x) { /* the message below still shows */ }
    try { welcome('fatal', `${state.jsError}. Mini Appʼni yopib, qayta oching.`); } catch (x) { /* nothing more to do */ }
  }
  window.addEventListener('error', (e) => { state.jsError = String(e.message || 'error'); });
  window.addEventListener('unhandledrejection', (e) => { const r = e.reason; state.jsError = String((r && r.message) || r || 'unhandled rejection'); });

  // ---------- events ----------
  feed.addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    ensureContext(); // sounds need a context that was started inside a tap
    const act = b.dataset.act, card = cardOf(b);
    if (act === 'sound') return toggleSound();
    if (act === 'sheet') return openSheet();
    if (state.recording) { if (act === 'mic') stop('manual'); return; }
    if (state.busy) return;
    if (act === 'tmode') return teachRequest();
    if (act === 'treq') return sendTeachRequest();
    if (act === 'tback') return welcome(state.home || 'soon');
    if (act === 'toteach') return enterTeach();
    if (act === 'toprof') return openProfile(state.hw ? state.hw.studentId : prof.kids.length ? prof.kids[0].id : null, { back: family ? '' : 'welcome' });
    if (act === 'profile') return prof.kids.length ? openProfile(prof.kids[0].id, { back: 'welcome' }) : null;
    if (act === 'begin') return begin();
    if (act === 'consent') return acceptConsent();
    if (act === 'reload') return location.reload();
    if (act === 'again') return restart();
    if (act === 'tomods') return setView('mods');
    if (!card) return;
    if (act === 'play') return manualPlay(card, RATE[card.stage]);
    if (act === 'slow') return manualPlay(card, SLOW_RATE);
    if (act === 'stage') return jumpStage(card, b.dataset.stage);
    if (act === 'said') return said(card);
    if (act === 'mic') return start(card);
    if (act === 'next') { clearTimeout(state.nextTimer); return goNext(card); }
  });
  // A swipe up on a card that is not finished yet cannot go anywhere: nudge the hint instead.
  let touchY = null;
  feed.addEventListener('touchstart', (e) => { touchY = e.touches[0].clientY; }, { passive: true });
  feed.addEventListener('touchend', (e) => {
    if (touchY === null) return;
    const dy = e.changedTouches[0].clientY - touchY;
    touchY = null;
    const card = cur();
    if (dy > -60 || !card || card.done || state.recording || state.busy) return;
    if (feed.scrollTop + feed.clientHeight >= feed.scrollHeight - 2) nudge(card);
  }, { passive: true });
  // Teacher mode: taps, the forms and the module of a week.
  $('teach').addEventListener('click', (e) => {
    const b = e.target.closest('[data-t]');
    if (!b || b.disabled || teach.busy) return;
    ensureContext();
    const a = b.dataset.t, id = b.dataset.id;
    if (a === 'home') return openView('home');
    if (a === 'group') return openView('group', { groupId: id || teach.groupId });
    if (a === 'student') { openView('student', { studentId: id || teach.studentId }); ensureLink(); return ensureReport(); }
    if (a === 'attend') {
      const g = groupById(teach.groupId), s = g && g.students.find((x) => x.id === id);
      if (!s) return;
      return teachAct(() => tapi('attend', { studentId: id, present: !s.attended }), (r) => {
        teach.notice = r.attended ? `✓ ${sname(s)} keldi${r.sent ? ' · ota-onaga xabar ketdi' : r.recipients ? '' : ' · ota-ona botga ulanmagan'}` : '';
        renderTeach();
      });
    }
    if (a === 'profile') return openProfile(teach.studentId, { back: 'student' });
    if (a === 'praise') {
      const g = groupById(teach.groupId), s = g && g.students.find((x) => x.id === id);
      return teachAct(() => tapi('praise', { studentId: id }), (r) => {
        teach.notice = r.already ? 'Bu darsda allaqachon maqtalgan.'
          : `👏 ${s ? sname(s) : 'Oʻquvchi'}: +${r.kg} kg${r.sent ? ' · ota-onaga xabar ketdi' : r.recipients ? '' : ' · ota-ona botga ulanmagan'}`;
        renderTeach();
      });
    }
    if (a === 'fig') return setTeachFigure(b.dataset.v);
    if (a === 'lshare') return shareLink();
    if (a === 'lcopy') return copyLink(b);
    if (a === 'lrotate') {
      return armed(b, () => teachAct(() => tapi('link', { studentId: teach.studentId, rotate: true }), (r) => {
        teach.link = r; teach.notice = 'Yangi havola tayyor: eskisi endi ishlamaydi.'; renderTeach(); ensureReport();
      }), 'Ha, almashtirish');
    }
    if (a === 'lunlink') {
      return armed(b, () => teachAct(() => tapi('unlink', { studentId: teach.studentId, telegramId: Number(id) }), (r) => {
        if (teach.link) teach.link.family = r.family;
        teach.notice = 'Uzildi: bu akkauntga endi xabar bormaydi.'; renderTeach(); ensureReport();
      }), 'Ha, uzish');
    }
    if (a === 'report') { openView('report'); return ensureReport(true); }
    if (a === 'gnew') return openView('gform', { form: {} });
    if (a === 'gedit') return openView('gform', { form: { id: teach.groupId } });
    if (a === 'snew') return openView('sform', { form: {} });
    if (a === 'sedit') return openView('sform', { form: { id: teach.studentId } });
    if (a === 'garchive') return armed(b, () => teachAct(() => tapi('group', { id: teach.form.id, archive: true }), () => openView('home')));
    if (a === 'sremove') return armed(b, () => teachAct(() => tapi('student', { id: teach.form.id, remove: true }), () => openView('group')));
    if (a === 'opennow') return armed(b, () => teachAct(() => tapi('open', { groupId: teach.groupId })));
    if (a === 'tapprove') {
      return teachAct(() => tapi('teacher', { telegramId: Number(id), status: 'active' }), (r) => {
        teach.notice = r.notified ? '✅ Tasdiqlandi. Unga botdan xabar bordi: trenajyorni qayta ochsa, oʻqituvchi rejimi ochiladi.'
          : '✅ Tasdiqlandi. Botdan xabar yuborib boʻlmadi: unga trenajyorni qayta ochishni ayting.';
        renderTeach();
      });
    }
    if (a === 'treject' || a === 'tremove') {
      return armed(b, () => teachAct(() => tapi('teacher', { telegramId: Number(id), status: 'removed' }), () => {
        teach.notice = a === 'treject' ? 'Soʻrov rad etildi.' : 'Oʻqituvchi oʻchirildi.';
        renderTeach();
      }), a === 'treject' ? 'Ha, rad etish' : 'Ha, oʻchirish');
    }
    if (a === 'lesson') return startLesson(teach.groupId, id);
    if (a === 'practice') return enterPractice();
    if (a === 'sheet') return openSheet();
  });
  $('teach').addEventListener('change', (e) => {
    const sel = e.target.closest('select[data-week]');
    if (sel) teachAct(() => tapi('week', { groupId: teach.groupId, weekStart: sel.dataset.week, moduleId: sel.value || null }));
  });
  $('teach').addEventListener('submit', (e) => {
    e.preventDefault();
    const f = e.target, fd = new FormData(f), editing = teach.form && teach.form.id;
    if (f.dataset.form === 'group') {
      const body = { name: String(fd.get('name') || ''), days: fd.getAll('day').map(Number) };
      if (editing) body.id = teach.form.id;
      if (fd.get('teacher')) body.teacherId = Number(fd.get('teacher'));
      return teachAct(() => tapi('group', body), (r) => openView('group', { groupId: r.id }));
    }
    if (f.dataset.form === 'student') {
      const age = String(fd.get('age') || '').trim();
      const body = { firstName: String(fd.get('firstName') || ''), lastName: String(fd.get('lastName') || ''), age: age ? Number(age) : null,
        parentPhone: String(fd.get('parentPhone') || ''), consent: fd.get('consent') === 'on', groupId: String(fd.get('groupId') || teach.groupId) };
      if (editing) body.id = teach.form.id;
      return teachAct(() => tapi('student', body), (r) => openView(editing ? 'student' : 'group', { groupId: body.groupId, studentId: r.id }));
    }
  });
  $('tabReels').addEventListener('click', () => setView('reels'));
  $('tabMods').addEventListener('click', () => setView('mods'));
  $('modList').addEventListener('click', (e) => {
    const b = e.target.closest('[data-mod]');
    if (!b) return;
    ensureContext(); // sounds and the sample need a tap to start
    openModule(b.dataset.mod, b.dataset.tw);
  });
  $('q').addEventListener('input', () => renderModules());
  $('reset').addEventListener('click', () => $('confirm').classList.toggle('hide'));
  $('resetNo').addEventListener('click', () => $('confirm').classList.add('hide'));
  $('resetYes').addEventListener('click', () => { $('confirm').classList.add('hide'); resetProgress(); });
  $('sheetWrap').addEventListener('click', (e) => { if (e.target === $('sheetWrap')) closeSheet(); });
  $('sheetClose').addEventListener('click', closeSheet);
  $('pick').addEventListener('change', (e) => {
    if (state.recording || state.busy) return;
    newSession(dailyList(Number(e.target.value) || 0));
    welcome('ready');
    closeSheet();
    setView('reels');
    go(state.cards[0].el);
  });
  $('copy').addEventListener('click', async () => {
    const text = $('diag').textContent;
    let ok = false;
    try { await navigator.clipboard.writeText(text); ok = true; } catch (e) {
      const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select(); try { ok = document.execCommand('copy'); } catch (e2) {} ta.remove();
    }
    $('copy').textContent = ok ? 'Nusxa olindi ✓' : 'Nusxa olinmadi';
    setTimeout(() => { $('copy').textContent = 'Nusxa olish'; }, 2500);
  });
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) return;
    stopVoice();
    if (state.recording) stop('hidden'); else releaseMic();
  });

  $('voice').addEventListener('timeupdate', () => { if (state.vdraw) state.vdraw(); });
  $('voice').addEventListener('ended', () => { if (state.voiceCard) stopVoice(true); });

  if (mock) window.__tez = { state, toWav16k, vad, syllables, parse, modulesNow, setView, teach, MOCKT, startLesson, enterTeach, callJson, mountSummary, showCheck, targetSeconds, prof, MOCKP, openProfile, closeProfile, claimGain, activate, startHomework, mockHwOf }; // local preview tests only
  init().catch(fatal);
})();
</script>
